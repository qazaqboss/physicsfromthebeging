const FIG3D = {};

const Lab3D = {
  _loading: null,
  ready() {
    if (window.THREE) return Promise.resolve();
    if (!this._loading) {
      this._loading = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "vendor/three.min.js";
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    return this._loading;
  },

  palette() {
    const cs = getComputedStyle(document.body);
    const v = (n) => cs.getPropertyValue(n).trim() || "#888";
    return {
      card: v("--anatomy-card"),
      face: v("--anatomy-face"),
      top: v("--anatomy-top"),
      shade: v("--anatomy-shade-1"),
      hi: v("--anatomy-hi"),
      mid: v("--anatomy-mid"),
      lo: v("--anatomy-lo"),
      faint: v("--anatomy-faint"),
      lit: v("--anatomy-lit"),
      red: v("--anatomy-red"),
      green: v("--anatomy-green"),
      blue: v("--anatomy-blue"),
      dark: document.body.dataset.theme === "dark",
    };
  },

  card(el, { fig, title, hint, keys = [], caption, controls = "", label, hud = "" }) {
    const stage = `<div class="iso-stage lab3d-stage" tabindex="0" role="group" aria-label="${label || title}"><canvas class="lab3d-canvas"></canvas>${hud ? `<div class="lab3d-hud">${hud}</div>` : ""}<div class="lab3d-drag" aria-hidden="true">⟲ вращайте</div></div>`;
    el.innerHTML = k.plateHtml({ fig, title, hint, readout: "", keys, caption, body: stage + (controls ? `<div class="lab-controls">${controls}</div>` : "") });
    const root = el.querySelector(".iso-figure");
    return {
      root,
      stage: root.querySelector(".iso-stage"),
      canvas: root.querySelector("canvas"),
      hud: root.querySelector(".lab3d-hud"),
      readout: root.querySelector("[data-readout]"),
      control: (name) => root.querySelector(`[data-control="${name}"]`),
      say(text) {
        if (this.readout.textContent !== text) this.readout.textContent = text;
      },
    };
  },

  scene(ui, { azimuth = 40, elevation = 28, radius = 100, center = [0, 0, 20], aspect = 0.68 } = {}) {
    const T = THREE;
    const renderer = new T.WebGLRenderer({ canvas: ui.canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
    const scene = new T.Scene();
    const cam = new T.OrthographicCamera(-1, 1, 1, -1, -2000, 2000);
    cam.up.set(0, 0, 1);
    const view = { az: azimuth, el: elevation, radius, center: new T.Vector3(...center), aspect };
    const hemi = new T.HemisphereLight(0xffffff, 0x888888, 0.75);
    hemi.position.set(0, 0, 1);
    const sun = new T.DirectionalLight(0xffffff, 0.55);
    sun.position.set(-0.6, -1, 1.6);
    const amb = new T.AmbientLight(0xffffff, 0.32);
    scene.add(hemi, sun, amb);
    const mats = [];
    const lines = [];
    let P = Lab3D.palette();

    const api = {
      T,
      scene,
      cam,
      renderer,
      view,
      get P() {
        return P;
      },
      mat(role = "face", extra = {}) {
        const m = new T.MeshLambertMaterial({ color: P[role] || role, ...extra });
        m.userData.role = role;
        mats.push(m);
        return m;
      },
      lineMat(role = "hi", extra = {}) {
        const m = new T.LineBasicMaterial({ color: P[role] || role, ...extra });
        m.userData.role = role;
        lines.push(m);
        return m;
      },
      outline(mesh, role = "hi", angle = 30) {
        const e = new T.LineSegments(new T.EdgesGeometry(mesh.geometry, angle), api.lineMat(role));
        mesh.add(e);
        return mesh;
      },
      solid(geo, role = "face", lineRole = "hi", angle = 30) {
        const m = new T.Mesh(geo, api.mat(role, { polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
        return api.outline(m, lineRole, angle);
      },
      box(w, d, h, x, y, z, role = "face", line = "hi") {
        const m = api.solid(new T.BoxGeometry(w, d, h), role, line);
        m.position.set(x, y, z + h / 2);
        scene.add(m);
        return m;
      },
      cyl(r, h, x, y, z, role = "face", line = "hi", seg = 32) {
        const g = new T.CylinderGeometry(r, r, h, seg);
        g.rotateX(Math.PI / 2);
        const m = api.solid(g, role, line, 40);
        m.position.set(x, y, z + h / 2);
        scene.add(m);
        return m;
      },
      line(points, role = "hi", extra) {
        const g = new T.BufferGeometry().setFromPoints(points.map((p) => (p.isVector3 ? p : new T.Vector3(...p))));
        const l = new T.Line(g, api.lineMat(role, extra));
        scene.add(l);
        return l;
      },
      plate(w, d, h = 6) {
        const g = new T.Group();
        const slab = api.solid(new T.BoxGeometry(w, d, h), "face", "mid");
        slab.position.z = -h / 2;
        g.add(slab);
        const inset = 5;
        const groove = [[-w / 2 + inset, -d / 2 + inset], [w / 2 - inset, -d / 2 + inset], [w / 2 - inset, d / 2 - inset], [-w / 2 + inset, d / 2 - inset], [-w / 2 + inset, -d / 2 + inset]];
        g.add(new T.Line(new T.BufferGeometry().setFromPoints(groove.map(([x, y]) => new T.Vector3(x, y, 0.05))), api.lineMat("lo")));
        for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
          const fg = new T.CylinderGeometry(4, 4.6, 3, 24);
          fg.rotateX(Math.PI / 2);
          const f = api.solid(fg, "shade", "mid", 40);
          f.position.set(sx * (w / 2 - 14), sy * (d / 2 - 14), -h - 1.5);
          g.add(f);
          const sg = new T.CircleGeometry(1.4, 16);
          const s = new T.Mesh(sg, api.mat("mid"));
          s.position.set(sx * (w / 2 - 8), sy * (d / 2 - 8), 0.08);
          g.add(s);
        }
        scene.add(g);
        return g;
      },
      arrow(role = "hi", { shaft = 0.5, head = 2.2, headLen = 5 } = {}) {
        const g = new T.Group();
        const sg = new T.CylinderGeometry(shaft, shaft, 1, 10);
        sg.translate(0, 0.5, 0);
        const s = new T.Mesh(sg, api.mat(role));
        const hg = new T.ConeGeometry(head, headLen, 16);
        hg.translate(0, -headLen / 2, 0);
        const h = new T.Mesh(hg, api.mat(role));
        g.add(s, h);
        g.userData = { s, h, headLen };
        g.set = (from, to) => {
          const a = from.isVector3 ? from : new T.Vector3(...from);
          const b = to.isVector3 ? to : new T.Vector3(...to);
          const dir = b.clone().sub(a);
          const len = dir.length();
          g.visible = len > 0.01;
          if (!g.visible) return;
          g.position.copy(a);
          g.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), dir.clone().normalize());
          const hl = Math.min(headLen, len * 0.45);
          s.scale.set(1, Math.max(0.001, len - hl * 0.9), 1);
          h.scale.set(hl / headLen, hl / headLen, hl / headLen);
          h.position.set(0, len, 0);
        };
        scene.add(g);
        return g;
      },
      repaint() {
        P = Lab3D.palette();
        mats.forEach((m) => m.color.set(P[m.userData.role] || m.userData.role));
        lines.forEach((m) => m.color.set(P[m.userData.role] || m.userData.role));
        hemi.groundColor.set(P.dark ? 0x222222 : 0x9a9a9a);
        hemi.intensity = P.dark ? 0.55 : 0.75;
        api.dirty = true;
      },
      resize() {
        const w = ui.canvas.clientWidth || 600;
        const h = Math.round(w * view.aspect);
        ui.canvas.style.height = `${h}px`;
        renderer.setSize(w, h, false);
        const r = view.radius;
        const ar = w / h;
        cam.left = -r * ar;
        cam.right = r * ar;
        cam.top = r;
        cam.bottom = -r;
        cam.updateProjectionMatrix();
        api.dirty = true;
      },
      place() {
        const a = (view.az * Math.PI) / 180;
        const e = (view.el * Math.PI) / 180;
        const d = 600;
        cam.position.set(view.center.x + Math.cos(e) * Math.cos(a) * d, view.center.y + Math.cos(e) * Math.sin(a) * d, view.center.z + Math.sin(e) * d);
        cam.lookAt(view.center);
      },
      render() {
        api.place();
        renderer.render(scene, cam);
        api.dirty = false;
      },
      dirty: true,
    };

    let drag = null;
    const hint = ui.stage.querySelector(".lab3d-drag");
    ui.canvas.addEventListener("pointerdown", (e) => {
      drag = { x: e.clientX, y: e.clientY, az: view.az, el: view.el, id: e.pointerId, moved: false };
    });
    addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 6) return;
      if (!drag.moved && Math.abs(dy) > Math.abs(dx) * 1.4 && e.pointerType === "touch") {
        drag = null;
        return;
      }
      drag.moved = true;
      if (hint) hint.style.opacity = "0";
      view.az = drag.az - dx * 0.4;
      view.el = Math.max(5, Math.min(85, drag.el + dy * 0.3));
      api.dirty = true;
    });
    addEventListener("pointerup", () => (drag = null));
    ui.canvas.style.touchAction = "pan-y";

    api.repaint();
    api.resize();
    new ResizeObserver(() => api.resize()).observe(ui.canvas);
    new MutationObserver(() => api.repaint()).observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
    return api;
  },

  run(ui, api, tick) {
    let alive = true;
    Lab.loop(ui.stage, (dt, calm) => {
      if (!ui.stage.isConnected) {
        if (alive) {
          alive = false;
          api.renderer.dispose();
        }
        return false;
      }
      const changed = tick(dt, calm);
      if (changed !== false || api.dirty) api.render();
      return true;
    });
  },

  mount(el, name, num) {
    el.innerHTML = `<div class="lab3d-loading">Загружаем 3D-лабораторию…</div>`;
    Lab3D.ready()
      .then(() => {
        if (el.isConnected) FIG3D[name](el, num);
      })
      .catch(() => {
        el.innerHTML = `<div class="lab3d-loading">Не удалось загрузить 3D (нет файла vendor/three.min.js).</div>`;
      });
  },

  matrixHtml(rows, cls = "") {
    return `<table class="mtx ${cls}"><tbody>${rows.map((r) => `<tr>${r.map((v) => `<td>${typeof v === "number" ? fmt(v, 2) : v}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  },
};

/* labs3d/deep.js */
FIG3D.lorentz = (el, num) => {
  const ui = Lab3D.card(el, {
    fig: `Fig ${num}`,
    title: "Заряд в магнитном поле",
    hint: "Меняйте поле и угол влёта",
    keys: [
      { mark: "lit", label: "Протон и его скорость" },
      { mark: "blue", label: "Линии поля B" },
      { mark: "red", label: "Сила Лоренца" },
    ],
    caption: "Сила F = q·v×B всегда перпендикулярна скорости: она поворачивает частицу, но не разгоняет её. Поперечная часть скорости даёт окружность радиуса r = mv⊥/(qB), продольная — сносит её вдоль поля. Получается спираль.",
    controls: Lab.range("b", "Поле B", { min: 0.4, max: 2, step: 0.05, value: 1 }) + Lab.range("a", "Угол к полю", { min: 10, max: 90, step: 1, value: 70 }),
  });
  const S = Lab3D.scene(ui, { azimuth: 30, elevation: 22, radius: 84, center: [0, 0, 34] });
  const { T } = S;
  S.plate(180, 110);
  const Z = 36, X0 = -80, X1 = 80;
  for (const sx of [-1, 1]) {
    S.box(10, 70, 4, sx * 88, 0, 0, "shade", "mid");
    S.box(6, 6, Z + 30, sx * 88, -30, 4, "face", "mid");
    S.box(6, 6, Z + 30, sx * 88, 30, 4, "face", "mid");
    const coil = new T.Mesh(new T.TorusGeometry(30, 3, 12, 64), S.mat("face"));
    S.outline(coil, "mid", 70);
    coil.position.set(sx * 84, 0, Z);
    coil.rotation.y = Math.PI / 2;
    S.scene.add(coil);
  }
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2, r = i ? 18 : 0;
    const l = S.line([[X0, Math.cos(a) * r, Z + Math.sin(a) * r], [X1, Math.cos(a) * r, Z + Math.sin(a) * r]], "blue");
    l.material.transparent = true;
    l.material.opacity = 0.45;
  }
  const bArrow = S.arrow("blue", { shaft: 0.5, head: 2.2, headLen: 5 });
  bArrow.set([X1 - 10, 0, Z + 26], [X1 + 6, 0, Z + 26]);
  const p = new T.Mesh(new T.SphereGeometry(2.6, 24, 16), S.mat("lit"));
  S.outline(p, "hi", 80);
  S.scene.add(p);
  const vA = S.arrow("hi", { shaft: 0.35, head: 1.4, headLen: 3.5 });
  const fA = S.arrow("red", { shaft: 0.35, head: 1.4, headLen: 3.5 });
  const N = 1400;
  const tr = new Float32Array(N * 3);
  const tg = new T.BufferGeometry();
  tg.setAttribute("position", new T.BufferAttribute(tr, 3));
  S.scene.add(new T.Line(tg, S.lineMat("mid")));
  let B = 1, ang = 70, n = 0;
  const st = { r: new T.Vector3(), v: new T.Vector3() };
  const V = 18;
  const launch = () => {
    const a = (ang * Math.PI) / 180;
    st.r.set(X0 + 4, 0, Z);
    st.v.set(V * Math.cos(a), V * Math.sin(a), 0);
    n = 0;
  };
  launch();
  Lab3D.run(ui, S, (dt, calm) => {
    const Bv = new T.Vector3(B * 0.9, 0, 0);
    const steps = 30, h = (calm ? 0 : dt * 1.6) / steps;
    let F = new T.Vector3();
    for (let i = 0; i < steps; i++) {
      F = st.v.clone().cross(Bv);
      const half = st.v.clone().addScaledVector(F, h / 2);
      F = half.cross(Bv);
      st.v.addScaledVector(F, h);
      st.v.setLength(V);
      st.r.addScaledVector(st.v, h);
    }
    p.position.copy(st.r);
    vA.set(st.r, st.r.clone().addScaledVector(st.v, 0.7));
    fA.set(st.r, st.r.clone().addScaledVector(st.v.clone().cross(Bv), 0.6));
    if (n < N) {
      tr.set(st.r.toArray(), n * 3);
      n++;
    }
    tg.setDrawRange(0, n);
    tg.attributes.position.needsUpdate = true;
    if (st.r.x > X1 || st.r.x < X0 - 10 || n >= N) launch();
    const a = (ang * Math.PI) / 180;
    const vPerp = V * Math.sin(a);
    const rad = vPerp / (B * 0.9);
    const pitch = ((2 * Math.PI) / (B * 0.9)) * V * Math.cos(a);
    ui.say(`B = ${fmt(B, 2)} Тл · угол ${ang}° · r = mv⊥/qB ≈ ${fmt(rad / 10, 1)} см · шаг спирали ≈ ${fmt(pitch / 10, 1)} см · |v| = const`);
    return true;
  });
  Lab.bindRange(ui, "b", (v) => {
    B = v;
    launch();
  }, (v) => `${fmt(v, 2)} Тл`);
  Lab.bindRange(ui, "a", (v) => {
    ang = v;
    launch();
  }, (v) => `${v}°`);
};

FIG3D.spacetime = (el, num) => {

    keys: [
      { mark: "lit", label: "Оси движущегося наблюдателя ct′, x′" },
      { mark: "raised", label: "Световой конус x = ±ct" },
      { mark: "red", label: "Линия одновременности t′ = const" },
    ],
    caption: "Время — вверх, плоскость — пространство (x, y). Конус — путь вспышки света. При скорости β оси ct′ и x′ наклоняются к конусу, но сам конус не меняется: скорость света одна для всех. Матрица Λ пересчитывает координаты события.",
    controls: Lab.range("b", "Скорость β = v/c", { min: -0.9, max: 0.9, step: 0.01, value: 0.5 }),
    hud: `<div class="mtx-wrap"><span class="mtx-label">Λ =</span><div data-hud="m"></div></div><div class="mtx-sub" data-hud="g"></div>`,
  });
  const S = Lab3D.scene(ui, { azimuth: 70, elevation: 16, radius: 74, center: [0, 0, 36] });
  const { T } = S;
  S.plate(140, 140);
  const O = new T.Vector3(0, 0, 36), L = 40;
  const cone = new T.Mesh(new T.ConeGeometry(L, L, 64, 1, true), new T.MeshLambertMaterial({ color: 0xf0a020, transparent: true, opacity: 0.16, side: T.DoubleSide, depthWrite: false }));
  cone.rotation.x = -Math.PI / 2;
  cone.position.set(O.x, O.y, O.z + L / 2);
  const cone2 = cone.clone();
  cone2.rotation.x = Math.PI / 2;
  cone2.position.set(O.x, O.y, O.z - L / 2);
  S.scene.add(cone, cone2);
  for (const s of [1, -1]) {
    const pts = [];
    for (let i = 0; i <= 96; i++) {
      const a = (i / 96) * Math.PI * 2;
      pts.push([O.x + Math.cos(a) * L, O.y + Math.sin(a) * L, O.z + s * L]);
    }
    S.line(pts, "mid");
  }
  S.line([[O.x - L, O.y, O.z - L], [O.x + L, O.y, O.z + L]], "mid");
  S.line([[O.x + L, O.y, O.z - L], [O.x - L, O.y, O.z + L]], "mid");
  S.arrow("faint", { shaft: 0.3, head: 1.2, headLen: 3 }).set(O.clone().add(new T.Vector3(-46, 0, 0)), O.clone().add(new T.Vector3(46, 0, 0)));
  S.arrow("faint", { shaft: 0.3, head: 1.2, headLen: 3 }).set(O.clone().add(new T.Vector3(0, 0, -46)), O.clone().add(new T.Vector3(0, 0, 46)));
  S.cyl(1.4, O.z - 46, 0, 0, 0, "shade", "mid");
  const tA = S.arrow("lit", { shaft: 0.6, head: 2.2, headLen: 5 });
  const xA = S.arrow("lit", { shaft: 0.6, head: 2.2, headLen: 5 });
  const simul = [0, 1, 2].map(() => S.line([[0, 0, 0], [1, 0, 0]], "red"));
  const grid = [];
  for (let i = -3; i <= 3; i++) grid.push(S.line([[0, 0, 0], [1, 0, 0]], "faint"), S.line([[0, 0, 0], [1, 0, 0]], "faint"));
  const evs = [[18, 14], [-10, 22], [24, -8]].map(([x, ct]) => {
    const m = new T.Mesh(new T.SphereGeometry(1.8, 16, 12), S.mat("hi"));
    m.position.set(O.x + x, O.y, O.z + ct);
    S.scene.add(m);
    return { x, ct, m };
  });
  let target = 0.5, beta = 0.5;
  Lab3D.run(ui, S, (dt, calm) => {
    const nb = Lab.follow(beta, target, dt, 0.25, calm);
    const moved = nb !== beta;
    beta = nb;
    const g = 1 / Math.sqrt(1 - beta * beta);
    const toW = (xp, ctp) => O.clone().add(new T.Vector3(g * (xp + beta * ctp), 0, g * (ctp + beta * xp)));
    tA.set(toW(0, -44 / g), toW(0, 44 / g));
    xA.set(toW(-44 / g, 0), toW(44 / g, 0));
    let gi = 0;
    for (let i = -3; i <= 3; i++) {
      grid[gi++].geometry.setFromPoints([toW(i * 10, -30), toW(i * 10, 30)]);
      grid[gi++].geometry.setFromPoints([toW(-30, i * 10), toW(30, i * 10)]);
    }
    evs.forEach((e, i) => {
      const ctp = g * (e.ct - beta * e.x);
      simul[i].geometry.setFromPoints([toW(-40, ctp), toW(40, ctp)]);
    });
    const m = Lab3D.matrixHtml([[g, -beta * g], [-beta * g, g]]);
    if (ui.hud.dataset.m !== m) {
      ui.hud.querySelector('[data-hud="m"]').innerHTML = m;
      ui.hud.dataset.m = m;
    }
    ui.hud.querySelector('[data-hud="g"]').textContent = `γ = ${fmt(g, 3)} · det Λ = 1`;
    const t1 = evs.map((e) => g * (e.ct - beta * e.x));
    ui.say(`β = ${fmt(beta, 2)} · γ = ${fmt(g, 3)} · события в системе′: t′ = ${t1.map((t) => fmt(t / 10, 2)).join(" / ")} · s² не меняется`);
    return moved || true;
  });
  Lab.bindRange(ui, "b", (v) => (target = v), (v) => fmt(v, 2));
};

FIG3D.orbitals = (el, num) => {
  const ui = Lab3D.card(el, {
    fig: `Fig ${num}`,
    title: "Орбитали водорода",
    hint: "Выберите орбиталь, вращайте",
    keys: [
      { mark: "dotted", label: "Каждая точка — положение электрона при одном измерении" },
      { mark: "red", label: "ψ > 0" },
      { mark: "blue", label: "ψ < 0" },
    ],
    caption: "Точки выбраны случайно с вероятностью |ψ|² — так выглядела бы серия измерений. Цвет показывает знак волновой функции. Узловые поверхности, где ψ = 0, остаются пустыми.",
    controls: `<div class="lab-row"><span class="lab-range-label">Орбиталь</span>${Lab.segmented("orb", [["1s", "1s"], ["2s", "2s"], ["2p", "2p"], ["3d", "3dz²"], ["3dxy", "3dxy"]], "2p")}</div>`,
  });
  const S = Lab3D.scene(ui, { azimuth: 35, elevation: 22, radius: 64, center: [0, 0, 42] });
  const { T } = S;
  S.plate(130, 110);
  S.cyl(12, 3, 0, 0, 0, "face", "mid", 40);
  S.cyl(1.2, 18, 0, 0, 3, "shade", "mid");
  const C = new T.Vector3(0, 0, 44);
  const nuc = new T.Mesh(new T.SphereGeometry(1.4, 16, 12), S.mat("lit"));
  nuc.position.copy(C);
  S.scene.add(nuc);
  const NPTS = innerWidth < 700 ? 5000 : 9000;
  const geo = new T.BufferGeometry();
  const pos = new Float32Array(NPTS * 3), col = new Float32Array(NPTS * 3);
  geo.setAttribute("position", new T.BufferAttribute(pos, 3));
  geo.setAttribute("color", new T.BufferAttribute(col, 3));
  const cloud = new T.Points(geo, new T.PointsMaterial({ size: 1.5, vertexColors: true, transparent: true, opacity: 0.8, depthWrite: false }));
  cloud.position.copy(C);
  S.scene.add(cloud);
  const PSI = {
    "1s": (x, y, z, r) => Math.exp(-r),
    "2s": (x, y, z, r) => (2 - r) * Math.exp(-r / 2),
    "2p": (x, y, z, r) => z * Math.exp(-r / 2),
    "3d": (x, y, z, r) => (3 * z * z - r * r) * Math.exp(-r / 3),
    "3dxy": (x, y, z, r) => x * y * Math.exp(-r / 3),
  };
  const EXT = { "1s": 5, "2s": 13, "2p": 12, "3d": 20, "3dxy": 20 };
  const NAME = { "1s": "1s (n=1, l=0)", "2s": "2s (n=2, l=0)", "2p": "2pz (n=2, l=1)", "3d": "3dz² (n=3, l=2)", "3dxy": "3dxy (n=3, l=2)" };
  let orb = "2p";
  function sample() {
    const f = PSI[orb], R = EXT[orb];
    let max = 0;
    for (let i = 0; i < 4000; i++) {
      const x = (Math.random() * 2 - 1) * R, y = (Math.random() * 2 - 1) * R, z = (Math.random() * 2 - 1) * R;
      const v = f(x, y, z, Math.hypot(x, y, z)) ** 2;
      if (v > max) max = v;
    }
    const red = new T.Color(S.P.red), blue = new T.Color(S.P.blue);
    const scale = 28 / R;
    let n = 0, guard = 0;
    while (n < NPTS && guard < NPTS * 400) {
      guard++;
      const x = (Math.random() * 2 - 1) * R, y = (Math.random() * 2 - 1) * R, z = (Math.random() * 2 - 1) * R;
      const psi = f(x, y, z, Math.hypot(x, y, z));
      if (Math.random() * max * 1.05 > psi * psi) continue;
      pos.set([x * scale, y * scale, z * scale], n * 3);
      const c = psi >= 0 ? red : blue;
      col.set([c.r, c.g, c.b], n * 3);
      n++;
    }
    geo.setDrawRange(0, n);
    geo.attributes.position.needsUpdate = true;
    geo.attributes.color.needsUpdate = true;
    ui.say(`${NAME[orb]} · ${n} измерений · точки распределены как |ψ|²`);
  }
  sample();
  new MutationObserver(sample).observe(document.body, { attributes: true, attributeFilter: ["data-theme"] });
  let spin = 0;
  Lab3D.run(ui, S, (dt, calm) => {
    spin += calm ? 0 : dt * 0.25;
    cloud.rotation.z = spin;
    return true;
  });
  Lab.bindSeg(ui, "orb", (v) => {
    orb = v;
    sample();
  });
};

/* labs3d/field.js */
FIG3D.field = (el, num) => {
  const ui = Lab3D.card(el, {
    fig: `Fig ${num}`,
    title: "Поле двух зарядов",
    hint: "Вращайте сцену, меняйте заряды",
    keys: [
      { mark: "red", label: "Положительный заряд" },
      { mark: "blue", label: "Отрицательный заряд" },
      { mark: "raised", label: "Силовые линии поля" },
    ],
    caption: "Линии выходят из «плюса» и входят в «минус». По ним бегут пробные заряды: где линии гуще, поле сильнее. Сила Кулона F = k·q₁q₂/r².",
    controls: `<div class="lab-row"><span class="lab-range-label">Второй заряд</span>${Lab.segmented("sign", [[-1, "−q"], [1, "+q"], [-2, "−2q"]], -1)}</div>` + Lab.range("d", "Расстояние", { min: 24, max: 70, step: 1, value: 46 }),
  });
  const S = Lab3D.scene(ui, { azimuth: 35, elevation: 26, radius: 92, center: [0, 0, 22] });
  const { T } = S;
  S.plate(170, 110);
  const Z = 30;
  const stands = [];
  const charges = [-1, 1].map((sx, i) => {
    const post = S.cyl(1.4, Z - 7, 0, 0, 0, "shade", "mid");
    const foot = S.cyl(6, 2.5, 0, 0, 0, "face", "mid");
    stands.push(post, foot);
    const ball = new T.Mesh(new T.SphereGeometry(6, 40, 28), S.mat(i ? "blue" : "red"));
    S.scene.add(ball);
    return { ball, post, foot, q: i ? -1 : 1 };
  });
  const lineMat = S.lineMat("mid");
  let lineGroup = new T.Group();
  S.scene.add(lineGroup);
  let paths = [];
  const dotGeo = new T.SphereGeometry(0.9, 10, 8);
  const dots = new T.InstancedMesh(dotGeo, S.mat("hi"), 140);
  S.scene.add(dots);
  let sep = 46, q2 = -1;

  function fieldAt(p) {
    const E = new T.Vector3();
    charges.forEach((c) => {
      const r = p.clone().sub(c.ball.position);
      const d = Math.max(r.length(), 1.5);
      E.addScaledVector(r, c.q / (d * d * d));
    });
    return E;
  }

  function build() {
    charges[0].ball.position.set(-sep / 2, 0, Z);
    charges[1].ball.position.set(sep / 2, 0, Z);
    charges[1].q = q2;
    charges[1].ball.material = S.mat(q2 > 0 ? "red" : "blue");
    charges.forEach((c) => {
      c.post.position.set(c.ball.position.x, 0, (Z - 7) / 2 + 0.01);
      c.foot.position.set(c.ball.position.x, 0, 1.25);
      c.ball.scale.setScalar(Math.abs(c.q) > 1 ? 1.25 : 1);
    });
    S.scene.remove(lineGroup);
    lineGroup = new T.Group();
    paths = [];
    const seeds = [];
    const n = 26;
    charges.forEach((c, ci) => {
      if (c.q < 0 && charges.some((o) => o.q > 0)) return;
      const count = Math.round(n * Math.abs(c.q));
      for (let i = 0; i < count; i++) {
        const y = 1 - (2 * (i + 0.5)) / count;
        const r = Math.sqrt(1 - y * y);
        const t = i * 2.39996;
        seeds.push({ from: c, dir: new T.Vector3(r * Math.cos(t), r * Math.sin(t), y), sign: c.q > 0 ? 1 : -1 });
      }
    });
    seeds.forEach(({ from, dir, sign }) => {
      const p = from.ball.position.clone().addScaledVector(dir, 6.5);
      const pts = [p.clone()];
      for (let s = 0; s < 420; s++) {
        const E = fieldAt(p);
        const m = E.length();
        if (m < 1e-7) break;
        const step = 0.9;
        const mid = p.clone().addScaledVector(E, (sign * step * 0.5) / m);
        const E2 = fieldAt(mid);
        p.addScaledVector(E2, (sign * step) / E2.length());
        pts.push(p.clone());
        const hit = charges.find((c) => c !== from && c.ball.position.distanceTo(p) < 6);
        if (hit || p.z < 1 || Math.abs(p.x) > 95 || Math.abs(p.y) > 70 || p.z > 95) break;
      }
      if (pts.length < 3) return;
      lineGroup.add(new T.Line(new T.BufferGeometry().setFromPoints(pts), lineMat));
      const len = [0];
      for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + pts[i].distanceTo(pts[i - 1]));
      paths.push({ pts, len, total: len[len.length - 1], sign });
    });
    S.scene.add(lineGroup);
    S.dirty = true;
    const F = (8.99e9 * 1e-6 * 1e-6 * Math.abs(q2)) / Math.pow(sep / 1000, 2);
    ui.say(`q₁ = +1 мкКл · q₂ = ${q2 > 0 ? "+" : "−"}${Math.abs(q2)} мкКл · r = ${sep} мм · F = ${fmt(F, 1)} Н · ${q2 > 0 ? "отталкивание" : "притяжение"}`);
  }

  const m4 = new T.Matrix4();
  let clock = 0;
  Lab3D.run(ui, S, (dt, calm) => {
    clock += calm ? 0 : dt;
    let k2 = 0;
    paths.forEach((path, i) => {
      if (k2 >= 140) return;
      for (let j = 0; j < 2 && k2 < 140; j++) {
        const u = ((clock * 22 + i * 13.7 + j * path.total * 0.5) % path.total + path.total) % path.total;
        const d = path.sign > 0 ? u : path.total - u;
        let a = 1;
        while (a < path.len.length - 1 && path.len[a] < d) a++;
        const f = (d - path.len[a - 1]) / Math.max(1e-6, path.len[a] - path.len[a - 1]);
        const p = path.pts[a - 1].clone().lerp(path.pts[a], f);
        m4.makeTranslation(p.x, p.y, p.z);
        dots.setMatrixAt(k2++, m4);
      }
    });
    dots.count = k2;
    dots.instanceMatrix.needsUpdate = true;
    return true;
  });
  Lab.bindSeg(ui, "sign", (v) => {
    q2 = +v;
    build();
  });
  Lab.bindRange(ui, "d", (v) => {
    sep = v;
    build();
  }, (v) => `${v} мм`);
};

FIG3D.rotation = (el, num) => {
  const ui = Lab3D.card(el, {
    fig: `Fig ${num}`,
    title: "Матрица поворота",
    hint: "Крутите углы, сравните порядок",
    keys: [
      { mark: "red", label: "Ось x′" },
      { mark: "green", label: "Ось y′" },
      { mark: "blue", label: "Ось z′" },
      { mark: "dashed", label: "Тот же поворот в обратном порядке" },
    ],
    caption: "R = Rz(γ)·Ry(β)·Rx(α). Столбцы матрицы — это куда переходят базисные векторы: первый столбец — новая ось x′, второй — y′, третий — z′. Определитель всегда равен 1.",
    controls: Lab.range("a", "α вокруг x", { min: -180, max: 180, step: 1, value: 35 }) + Lab.range("b", "β вокруг y", { min: -90, max: 90, step: 1, value: 25 }) + Lab.range("g", "γ вокруг z", { min: -180, max: 180, step: 1, value: 20 }) + `<label class="guide-auto lab-check"><input type="checkbox" data-control="ghost" checked> показать обратный порядок</label>`,
    hud: `<div class="mtx-wrap"><span class="mtx-label">R =</span><div data-hud="m"></div></div><div class="mtx-sub" data-hud="det"></div>`,
  });
  const S = Lab3D.scene(ui, { azimuth: 38, elevation: 24, radius: 74, center: [0, 0, 30] });
  const { T } = S;
  S.plate(150, 110);
  S.cyl(14, 4, 0, 0, 0, "face", "mid", 48);
  S.cyl(2, 14, 0, 0, 4, "shade", "mid");
  const C = new T.Vector3(0, 0, 38);
  const gim = [];
  for (let i = 0; i < 3; i++) {
    const tg = new T.TorusGeometry(30 - i * 3.5, 0.6, 8, 96);
    const t = new T.Mesh(tg, S.mat("mid"));
    t.position.copy(C);
    S.scene.add(t);
    gim.push(t);
  }
  const body = new T.Group();
  body.position.copy(C);
  const book = S.solid(new T.BoxGeometry(26, 18, 6), "face", "hi");
  body.add(book);
  const spine = S.solid(new T.BoxGeometry(26, 2, 6.4), "lit", "hi");
  spine.position.y = -9;
  body.add(spine);
  const label = S.solid(new T.BoxGeometry(14, 6, 0.6), "shade", "mid");
  label.position.z = 3.2;
  body.add(label);
  S.scene.add(body);
  const axes = ["red", "green", "blue"].map((c) => S.arrow(c, { shaft: 0.55, head: 2, headLen: 5 }));
  const ghost = ["red", "green", "blue"].map((c) => {
    const pts = [new T.Vector3(), new T.Vector3()];
    const l = new T.Line(new T.BufferGeometry().setFromPoints(pts), new T.LineDashedMaterial({ color: 0x888888, dashSize: 2, gapSize: 1.6 }));
    l.material.userData.role = c;
    S.scene.add(l);
    return l;
  });
  const fixed = [[1, 0, 0], [0, 1, 0], [0, 0, 1]].map((v) => S.line([C.toArray(), C.clone().add(new T.Vector3(...v).multiplyScalar(36)).toArray()], "faint"));
  const ang = { a: 35, b: 25, g: 20 };
  const cur = { a: 35, b: 25, g: 20 };
  const showGhost = ui.control("ghost");
  const rad = (x) => (x * Math.PI) / 180;
  const Rx = (t) => new T.Matrix4().makeRotationX(rad(t));
  const Ry = (t) => new T.Matrix4().makeRotationY(rad(t));
  const Rz = (t) => new T.Matrix4().makeRotationZ(rad(t));

  Lab3D.run(ui, S, (dt, calm) => {
    let moved = false;
    for (const key of ["a", "b", "g"]) {
      const n = Lab.follow(cur[key], ang[key], dt, 0.18, calm);
      if (n !== cur[key]) moved = true;
      cur[key] = n;
    }
    const R = Rz(cur.g).multiply(Ry(cur.b)).multiply(Rx(cur.a));
    const Rrev = Rx(cur.a).multiply(Ry(cur.b)).multiply(Rz(cur.g));
    body.quaternion.setFromRotationMatrix(R);
    gim[0].quaternion.setFromRotationMatrix(Rz(cur.g).multiply(new T.Matrix4().makeRotationX(Math.PI / 2)));
    gim[1].quaternion.setFromRotationMatrix(Rz(cur.g).multiply(Ry(cur.b)).multiply(new T.Matrix4().makeRotationY(Math.PI / 2)));
    gim[2].quaternion.setFromRotationMatrix(R);
    const e = R.elements;
    const cols = [0, 1, 2].map((c) => new T.Vector3(e[c * 4], e[c * 4 + 1], e[c * 4 + 2]));
    cols.forEach((v, i) => axes[i].set(C, C.clone().addScaledVector(v, 30)));
    const er = Rrev.elements;
    ghost.forEach((l, i) => {
      const v = new T.Vector3(er[i * 4], er[i * 4 + 1], er[i * 4 + 2]);
      l.geometry.setFromPoints([C, C.clone().addScaledVector(v, 30)]);
      l.computeLineDistances();
      l.material.color.set(S.P[l.material.userData.role]);
      l.visible = showGhost.checked;
    });
    const rows = [0, 1, 2].map((r) => [0, 1, 2].map((c) => e[c * 4 + r]));
    const m = Lab3D.matrixHtml(rows);
    if (ui.hud.dataset.m !== m) {
      ui.hud.querySelector('[data-hud="m"]').innerHTML = m;
      ui.hud.dataset.m = m;
    }
    const det = new T.Matrix3().setFromMatrix4(R).determinant();
    const diff = cols.reduce((s, v, i) => s + v.distanceTo(new T.Vector3(er[i * 4], er[i * 4 + 1], er[i * 4 + 2])), 0);
    ui.hud.querySelector('[data-hud="det"]').textContent = `det R = ${fmt(det, 3)} · Rᵀ·R = 1`;
    ui.say(`α = ${Math.round(cur.a)}° · β = ${Math.round(cur.b)}° · γ = ${Math.round(cur.g)}° · Rz·Ry·Rx ${diff > 0.05 ? "≠" : "="} Rx·Ry·Rz`);
    return moved || true;
  });
  for (const key of ["a", "b", "g"]) Lab.bindRange(ui, key, (v) => (ang[key] = v), (v) => `${v}°`);
};

  const S = Lab3D.scene(ui, { azimuth: 30, elevation: 20, radius: 72, center: [0, 0, 40] });

  S.cyl(16, 4, 0, 0, 0, "face", "mid", 48);
  S.cyl(1.8, 10, 0, 0, 4, "shade", "mid");
  const C = new T.Vector3(0, 0, 48);
  const R = 30;
  const shell = new T.Mesh(new T.SphereGeometry(R, 48, 32), new T.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.12, depthWrite: false }));
  shell.position.copy(C);
  S.scene.add(shell);
  const circle = (n, f) => {

  };

  ring.position.copy(C);

  S.arrow(axC.y, { shaft: 0.3, head: 1.3, headLen: 3.5 }).set(C, C.clone().add(new T.Vector3(0, R + 8, 0)));
  S.arrow(axC.z, { shaft: 0.3, head: 1.3, headLen: 3.5 }).set(C, C.clone().add(new T.Vector3(0, 0, R + 8)));
  const poleUp = new T.Mesh(new T.SphereGeometry(1.6, 16, 12), S.mat("hi"));
  poleUp.position.set(C.x, C.y, C.z + R);
  const poleDn = poleUp.clone();
  poleDn.position.set(C.x, C.y, C.z - R);
  S.scene.add(poleUp, poleDn);
  const psi = S.arrow("lit", { shaft: 0.9, head: 2.8, headLen: 6.5 });
  const tip = new T.Mesh(new T.SphereGeometry(2.4, 24, 16), S.mat("lit"));
  S.outline(tip, "hi", 80);
  S.scene.add(tip);
  const dash = (role) => {
    const l = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3()]), new T.LineDashedMaterial({ color: S.P[role], dashSize: 1.6, gapSize: 1.2 }));
    l.material.userData.role = role;
    S.scene.add(l);
    return l;
  };
  const dz = dash("hi"), dxy = dash("mid");
  const TRAIL = 220;
  const trPos = new Float32Array(TRAIL * 3);
  const trGeo = new T.BufferGeometry();
  trGeo.setAttribute("position", new T.BufferAttribute(trPos, 3));
  S.scene.add(new T.Line(trGeo, S.lineMat("mid")));
  let tn = 0;
  const target = { th: 60, ph: 30 };
  const cur = { th: 60, ph: 30 };
  const field = ui.control("field");
  const phIn = ui.control("ph");
  Lab3D.run(ui, S, (dt, calm) => {
    if (field.checked && !calm) {
      target.ph = (target.ph + dt * 50) % 360;
      cur.ph = target.ph;
      phIn.value = String(Math.round(target.ph));
      ui.root.querySelector('[data-out="ph"]').textContent = `${Math.round(target.ph)}°`;
    } else {
      let d = target.ph - cur.ph;
      if (d > 180) d -= 360;
      if (d < -180) d += 360;
      cur.ph = Lab.follow(cur.ph, cur.ph + d, dt, 0.18, calm);
    }
    cur.th = Lab.follow(cur.th, target.th, dt, 0.18, calm);
    const th = (cur.th * Math.PI) / 180, ph = (cur.ph * Math.PI) / 180;
    const v = new T.Vector3(Math.sin(th) * Math.cos(ph), Math.sin(th) * Math.sin(ph), Math.cos(th));
    const p = C.clone().addScaledVector(v, R);
    psi.set(C, p);
    tip.position.copy(p);
    dz.geometry.setFromPoints([p, new T.Vector3(C.x, C.y, p.z)]);
    dz.computeLineDistances();
    dxy.geometry.setFromPoints([p, new T.Vector3(p.x, p.y, C.z)]);
    dxy.computeLineDistances();
    [dz, dxy].forEach((l) => l.material.color.set(S.P[l.material.userData.role]));
    if (tn < TRAIL) tn++;
    else trPos.copyWithin(0, 3);
    trPos.set(p.toArray(), (tn - 1) * 3);
    trGeo.setDrawRange(0, tn);
    trGeo.attributes.position.needsUpdate = true;
    const a0 = Math.cos(th / 2), a1 = Math.sin(th / 2);
    const P0 = a0 * a0;
    ui.hud.querySelector('[data-hud="ket"]').innerHTML = `|ψ⟩ = ${fmt(a0, 2)}|0⟩ + e<sup>i·${Math.round(cur.ph)}°</sup>·${fmt(a1, 2)}|1⟩`;

    ui.hud.querySelector('[data-hud="pv"]').textContent = `${Math.round(P0 * 100)} %`;
    ui.say(`θ = ${Math.round(cur.th)}° · φ = ${Math.round(cur.ph)}° · ⟨σx⟩ = ${fmt(v.x)} · ⟨σy⟩ = ${fmt(v.y)} · ⟨σz⟩ = ${fmt(v.z)} · P(↑) = ${fmt(P0)}`);
    return true;
  });
  Lab.bindRange(ui, "th", (v) => {
    target.th = v;
    tn = 0;
  }, (v) => `${v}°`);
  Lab.bindRange(ui, "ph", (v) => {
    target.ph = v;
  }, (v) => `${v}°`);
  phIn.addEventListener("input", () => {
    field.checked = false;
    tn = 0;
  });
};

/* labs3d/orbits.js */
FIG3D.orbits = (el, num) => {
  const ui = Lab3D.card(el, {
    fig: `Fig ${num}`,
    title: "Орбиты и Кеплер",
    hint: "Меняйте скорость запуска",
    keys: [
      { mark: "lit", label: "Планета и её скорость" },
      { mark: "dotted", label: "След орбиты" },
    ],
    caption: "Модель: одна звезда, сила тяготения F = GMm/r². При v = v₁ орбита круговая, при v₁ < v < √2·v₁ — эллипс, при v ≥ √2·v₁ планета уходит навсегда. Масштаб времени ускорен.",
    controls: Lab.range("v", "Скорость", { min: 0.55, max: 1.5, step: 0.01, value: 1.15 }) + Lab.button("go", "Запуск", true),
  });
  const S = Lab3D.scene(ui, { azimuth: 40, elevation: 34, radius: 98, center: [0, 0, 8] });
  const { T } = S;
  S.plate(190, 150);
  const Z = 22;
  S.cyl(16, 4, 0, 0, 0, "face", "mid", 48);
  S.cyl(1.6, Z - 8, 0, 0, 4, "shade", "mid");
  const ring = [];
  for (let i = 0; i <= 128; i++) {
    const a = (i / 128) * Math.PI * 2;
    ring.push([Math.cos(a) * 70, Math.sin(a) * 70, Z]);
  }
  S.line(ring, "faint");
  const ticks = [];
  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * Math.PI * 2;
    const r2 = i % 6 ? 66 : 62;
    ticks.push(new T.Vector3(Math.cos(a) * 70, Math.sin(a) * 70, Z), new T.Vector3(Math.cos(a) * r2, Math.sin(a) * r2, Z));
  }
  S.scene.add(new T.LineSegments(new T.BufferGeometry().setFromPoints(ticks), S.lineMat("lo")));
  const star = new T.Mesh(new T.SphereGeometry(8, 48, 32), new T.MeshBasicMaterial({ color: 0xf0a020 }));
  star.position.set(0, 0, Z);
  S.scene.add(star);
  const glowTex = (() => {
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,200,90,0.9)");
    gr.addColorStop(0.35, "rgba(255,170,60,0.35)");
    gr.addColorStop(1, "rgba(255,150,40,0)");
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    return new T.CanvasTexture(c);
  })();
  const glow = new T.Sprite(new T.SpriteMaterial({ map: glowTex, depthWrite: false, transparent: true }));
  glow.scale.set(46, 46, 1);
  glow.position.copy(star.position);
  S.scene.add(glow);
  const planet = new T.Mesh(new T.SphereGeometry(3.6, 32, 20), S.mat("lit"));
  S.outline(planet, "hi", 80);
  S.scene.add(planet);
  const vel = S.arrow("hi", { shaft: 0.35, head: 1.6, headLen: 4 });
  const MAXT = 900;
  const trailPos = new Float32Array(MAXT * 3);
  const trailGeo = new T.BufferGeometry();
  trailGeo.setAttribute("position", new T.BufferAttribute(trailPos, 3));
  const trail = new T.Line(trailGeo, S.lineMat("mid"));
  S.scene.add(trail);

  const GM = 1, R0 = 30;
  const v1 = Math.sqrt(GM / R0);
  let vk = 1.15;
  const st = { p: new T.Vector2(), v: new T.Vector2(), n: 0, t: 0, gone: 0 };
  function launch() {
    st.p.set(R0, 0);
    st.v.set(0, vk * v1);
    st.n = 0;
    st.t = 0;
    st.gone = 0;
  }
  launch();
  const k = 2.4;
  Lab3D.run(ui, S, (dt, calm) => {
    const steps = 60;
    const h = (calm ? 0 : dt * 22) / steps;
    for (let i = 0; i < steps; i++) {
      const r = st.p.length();
      const a = st.p.clone().multiplyScalar(-GM / (r * r * r));
      st.v.addScaledVector(a, h);
      st.p.addScaledVector(st.v, h);
    }
    st.t += dt;
    const r = st.p.length();
    const pos = new T.Vector3(st.p.x * k, st.p.y * k, Z);
    planet.position.copy(pos);
    vel.set(pos, pos.clone().add(new T.Vector3(st.v.x, st.v.y, 0).multiplyScalar(k * 70)));
    if (st.n < MAXT) {
      trailPos.set([pos.x, pos.y, pos.z], st.n * 3);
      st.n++;
    } else {
      trailPos.copyWithin(0, 3);
      trailPos.set([pos.x, pos.y, pos.z], (MAXT - 1) * 3);
    }
    trailGeo.setDrawRange(0, st.n);
    trailGeo.attributes.position.needsUpdate = true;
    const E = st.v.lengthSq() / 2 - GM / r;
    const kind = Math.abs(vk - 1) < 0.015 ? "круговая орбита" : E < 0 ? "эллипс" : "уходит на бесконечность";
    ui.say(`v = ${fmt(vk, 2)}·v₁ · r = ${fmt(r / R0, 2)}·R₀ · скорость сейчас ${fmt(st.v.length() / v1, 2)}·v₁ · ${kind}`);
    if (r * k > 115) {
      st.gone += dt;
      if (st.gone > 1.2) launch();
    }
    return true;
  });
  Lab.bindRange(ui, "v", (v) => {
    vk = v;
    launch();
  }, (v) => `${fmt(v, 2)}·v₁`);
  ui.control("go").addEventListener("click", launch);
};

    B.push(S.arrow("blue", { shaft: 0.3, head: 1.2, headLen: 3 }));
  }
  const M = 160;
  const eGeo = new T.BufferGeometry().setAttribute("position", new T.BufferAttribute(new Float32Array(M * 3), 3));
  const bGeo = new T.BufferGeometry().setAttribute("position", new T.BufferAttribute(new Float32Array(M * 3), 3));
  S.scene.add(new T.Line(eGeo, S.lineMat("red")), new T.Line(bGeo, S.lineMat("blue")));
  let lam = 70, ph = 0;
  const A = 22;
  Lab3D.run(ui, S, (dt, calm) => {
    ph += calm ? 0 : dt * 2.2;
    const kx = (2 * Math.PI) / lam;
    for (let i = 0; i < N; i++) {
      const x = X0 + ((X1 - X0) * (i + 0.5)) / N;
      const s = Math.sin(kx * (x - X0) - ph);
      E[i].set([x, 0, Z], [x, 0, Z + A * s]);
      B[i].set([x, 0, Z], [x, A * 0.75 * s, Z]);
    }
    const ep = eGeo.attributes.position.array, bp = bGeo.attributes.position.array;
    for (let i = 0; i < M; i++) {
      const x = X0 + ((X1 - X0) * i) / (M - 1);
      const s = Math.sin(kx * (x - X0) - ph);
      ep.set([x, 0, Z + A * s], i * 3);
      bp.set([x, A * 0.75 * s, Z], i * 3);
    }
    eGeo.attributes.position.needsUpdate = true;
    bGeo.attributes.position.needsUpdate = true;
    const lamNm = 380 + ((lam - 30) / 90) * 370;
    ui.say(`λ = ${Math.round(lamNm)} нм (видимый свет) · ν = ${fmt(3e8 / (lamNm * 1e-9) / 1e14, 2)}·10¹⁴ Гц · c = λ·ν = 3·10⁸ м/с`);
    return true;
  });
  Lab.bindRange(ui, "lam", (v) => (lam = v), (v) => `${Math.round(380 + ((v - 30) / 90) * 370)} нм`);
};

FIG3D.interference = (el, num) => {
  const ui = Lab3D.card(el, {
    fig: `Fig ${num}`,
    title: "Интерференция",
    hint: "Меняйте расстояние и длину волны",
    keys: [
      { mark: "lit", label: "Два когерентных источника" },
      { mark: "raised", label: "Поверхность волн" },
    ],
    caption: "Два вибратора качают воду в одной фазе. Вдоль линий, где разность хода равна целому числу длин волн, волны усиливаются, а между ними гасят друг друга.",
    controls: Lab.range("d", "Между источниками", { min: 10, max: 50, step: 1, value: 28 }) + Lab.range("lam", "Длина волны", { min: 8, max: 22, step: 0.5, value: 13 }),
  });
  const S = Lab3D.scene(ui, { azimuth: 30, elevation: 42, radius: 92, center: [0, 0, 6] });
  const { T } = S;
  const W = 150, SEG = Math.min(120, innerWidth < 700 ? 90 : 120);
  S.box(W + 10, W + 10, 4, 0, 0, -4, "face", "mid");
  const geo = new T.PlaneGeometry(W, W, SEG, SEG);
  const water = new T.Mesh(geo, new T.MeshLambertMaterial({ color: 0x9fb3c8, flatShading: false }));
  water.position.z = 6;
  S.scene.add(water);
  const pos = geo.attributes.position;
  const base = Float32Array.from(pos.array);
  for (const sx of [-1, 1]) {
    S.box(W + 10, 3, 9, 0, (sx * (W + 7)) / 2, -4, "face", "mid");
    S.box(3, W + 10, 9, (sx * (W + 7)) / 2, 0, -4, "face", "mid");
  }
  const bar = S.box(4, 80, 4, -W / 2 + 12, 0, 26, "shade", "mid");
  const pins = [0, 1].map(() => S.cyl(1.4, 20, 0, 0, 6, "lit", "hi"));
  let d = 28, lam = 13, ph = 0;
  Lab3D.run(ui, S, (dt, calm) => {
    ph += calm ? 0 : dt * 3.2;
    const k2 = (2 * Math.PI) / lam;
    const sx = -W / 2 + 12;
    const y1 = -d / 2, y2 = d / 2;
    const bob = Math.sin(ph) * 1.2;
    pins[0].position.set(sx, y1, 6 + 10 + bob);
    pins[1].position.set(sx, y2, 6 + 10 + bob);
    bar.position.z = 26 + 2 + bob;
    const a = pos.array;
    for (let i = 0; i < a.length; i += 3) {
      const x = base[i], y = base[i + 1];
      const r1 = Math.hypot(x - sx, y - y1) + 0.5, r2 = Math.hypot(x - sx, y - y2) + 0.5;
      const h = (Math.sin(k2 * r1 - ph) / Math.sqrt(r1 / 6 + 1) + Math.sin(k2 * r2 - ph) / Math.sqrt(r2 / 6 + 1)) * 2.2;
      a[i + 2] = x < sx ? 0 : h;
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();
    const L = 1, spacing = (lam / d) * L;
    ui.say(`d = ${d} мм · λ = ${fmt(lam, 1)} мм · угол первого максимума ≈ ${fmt((Math.asin(Math.min(1, lam / d)) * 180) / Math.PI, 0)}° · полос: ${Math.floor(d / lam) * 2 + 1}`);
    return true;
  });
  Lab.bindRange(ui, "d", (v) => (d = v), (v) => `${v} мм`);
  Lab.bindRange(ui, "lam", (v) => (lam = v), (v) => `${fmt(v, 1)} мм`);
};

const Guide = (() => {
  const STEPS = GUIDE_STEPS;
  const DATA = typeof GUIDE_DATA === "object" ? GUIDE_DATA : {};
  const BARS = 28;
  const store = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? fallback : JSON.parse(v);
      } catch {
        return fallback;
      }
    },
    set(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    },
  };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const words = (text) => text.split(/\s+/).filter(Boolean);
  const bars5 = '<i></i>'.repeat(5);

  const launcher = document.createElement("button");
  launcher.type = "button";
  launcher.className = "guide-launcher";
  launcher.setAttribute("aria-label", "Голосовой гид");
  launcher.innerHTML = `<span class="guide-avatar" aria-hidden="true">${bars5}</span><span class="guide-launcher-text"><b>Гид Лина</b><span>экскурсия голосом</span></span>`;

  const panel = document.createElement("section");
  panel.className = "guide";
  panel.setAttribute("aria-label", "Голосовой гид");
  panel.hidden = true;
  panel.innerHTML = `
    <header class="guide-head">
      <span class="guide-avatar guide-avatar-lg" aria-hidden="true">${bars5}</span>
      <div class="guide-who"><b>Лина</b><span data-g="where"></span></div>
      <span class="guide-count" data-g="count"></span>
      <button type="button" class="guide-x" data-g="close" aria-label="Закрыть гида">✕</button>
    </header>
    <div class="guide-wave" aria-hidden="true">${"<i></i>".repeat(BARS)}</div>
    <p class="guide-text" data-g="text" aria-live="polite"></p>
    <div class="guide-bar" aria-hidden="true"><span data-g="bar"></span></div>
    <footer class="guide-ctrl">
      <button type="button" class="guide-btn" data-g="prev" aria-label="Назад">‹</button>
      <button type="button" class="guide-btn guide-play" data-g="play" aria-label="Пауза"><span></span></button>
      <button type="button" class="guide-btn" data-g="next" aria-label="Дальше">›</button>
      <label class="guide-auto"><input type="checkbox" data-g="auto" checked> авто</label>
      <div class="guide-dots" data-g="dots">${STEPS.map((s, i) => `<button type="button" data-step="${i}" aria-label="${esc(s.title)}"></button>`).join("")}</div>
    </footer>`;

  const ring = document.createElement("div");
  ring.className = "guide-ring";
  ring.hidden = true;
  document.body.append(ring, launcher, panel);

  const $ = (name) => panel.querySelector(`[data-g="${name}"]`);
  const bars = [...panel.querySelectorAll(".guide-wave i")];
  const audio = new Audio();
  audio.preload = "auto";
  const clip = new Audio();
  clip.preload = "auto";
  let clipBtn = null;

  const st = { i: 0, open: false, playing: false, wordEls: [], timings: null, env: [], raf: 0, next: 0, act: 0, targetEl: null, upto: -2 };
  const api = { navigating: false };
  const auto = $("auto");
  auto.checked = store.get("guide-auto", true);
  auto.addEventListener("change", () => store.set("guide-auto", auto.checked));

  function renderText(step) {
    const list = words(step.text);
    const d = DATA[step.id] || {};
    st.timings = d.words && d.words.length === list.length ? d.words : null;
    st.env = d.env || [];
    $("text").innerHTML = list.map((w) => `<span>${esc(w)}</span>`).join(" ");
    st.wordEls = [...$("text").children];
    st.upto = -2;
    $("text").scrollTop = 0;
  }

  function placeRing() {
    const el = st.targetEl;
    if (!el || !st.open || !el.isConnected) {
      ring.hidden = true;
      return;
    }
    const r = el.getBoundingClientRect();
    const pad = 10;
    ring.hidden = false;
    ring.style.transform = `translate(${r.left - pad}px, ${r.top - pad}px)`;
    ring.style.width = `${r.width + pad * 2}px`;
    ring.style.height = `${r.height + pad * 2}px`;
  }

  function settleTarget(step) {
    st.targetEl = document.querySelector(step.target);
    if (!st.targetEl) return;
    st.targetEl.scrollIntoView({ behavior: STILL.matches ? "auto" : "smooth", block: step.target === ".topic-figure" ? "center" : "start" });
    if (innerWidth > 1020) {
      const r = st.targetEl.getBoundingClientRect();
      const side = r.width < innerWidth * 0.8 && r.left + r.width / 2 > innerWidth / 2 ? "left" : "right";
      if (panel.dataset.side !== side) {
        panel.removeAttribute("data-in");
        setTimeout(() => {
          panel.dataset.side = side;
          if (st.open) panel.setAttribute("data-in", "");
        }, 260);
      }
    }
    clearTimeout(st.act);
    if (step.action) {
      st.act = setTimeout(() => {
        if (!st.open || STEPS[st.i] !== step) return;
        const sel = step.action.startsWith("seg:") ? `[data-value="${step.action.slice(4)}"]` : `[data-control="${step.action}"]`;
        const tryClick = (n) => {
          const b = document.querySelector(`${step.target} ${sel}`);
          if (b) b.click();
          else if (n > 0) setTimeout(() => tryClick(n - 1), 400);
        };
        tryClick(6);
      }, 1500);
    }
  }

  function go(i, { play = true } = {}) {
    clearTimeout(st.next);
    stopClip();
    st.i = Math.max(0, Math.min(STEPS.length - 1, i));
    const step = STEPS[st.i];
    $("count").textContent = `${st.i + 1} / ${STEPS.length}`;
    $("where").textContent = step.title;
    $("dots").querySelectorAll("button").forEach((b, j) => {
      b.toggleAttribute("data-on", j === st.i);
      b.toggleAttribute("data-done", j < st.i);
    });
    $("prev").disabled = st.i === 0;
    $("next").disabled = st.i === STEPS.length - 1;
    renderText(step);
    const here = location.hash || "#/";
    if (here !== step.route) {
      api.navigating = true;
      st.targetEl = null;
      const onRouted = () => {
        document.removeEventListener("routed", onRouted);
        setTimeout(() => {
          api.navigating = false;
          settleTarget(step);
        }, 120);
      };
      document.addEventListener("routed", onRouted);
      location.hash = step.route;
    } else settleTarget(step);
    audio.src = `audio/guide/${step.id}.mp3`;
    audio.currentTime = 0;
    if (play) {
      const p = audio.play();
      if (p && p.catch) p.catch(() => setPlaying(false));
    }
    const nextStep = STEPS[st.i + 1];
    if (nextStep) {
      const pre = new Audio();
      pre.preload = "auto";
      pre.src = `audio/guide/${nextStep.id}.mp3`;
    }
    store.set("guide-step", st.i);
    tick();
  }

  function setPlaying(on) {
    st.playing = on;
    panel.toggleAttribute("data-playing", on);
    launcher.toggleAttribute("data-playing", on);
    $("play").setAttribute("aria-label", on ? "Пауза" : "Слушать");
  }

  function open(i = store.get("guide-step", 0)) {
    st.open = true;
    panel.hidden = false;
    body.setAttribute("data-guide", "");
    requestAnimationFrame(() => panel.setAttribute("data-in", ""));
    launcher.setAttribute("data-hidden", "");
    go(i >= STEPS.length - 1 ? 0 : i);
  }

  function close() {
    st.open = false;
    audio.pause();
    clearTimeout(st.next);
    clearTimeout(st.act);
    panel.removeAttribute("data-in");
    body.removeAttribute("data-guide");
    launcher.removeAttribute("data-hidden");
    ring.hidden = true;
    setTimeout(() => {
      if (!st.open) panel.hidden = true;
    }, 400);
  }

  function tick() {
    cancelAnimationFrame(st.raf);
    const loop = () => {
      const t = audio.currentTime || 0;
      const dur = audio.duration || (DATA[STEPS[st.i].id] || {}).dur || 1;
      $("bar").style.transform = `scaleX(${Math.min(1, t / dur)})`;
      const n = st.wordEls.length;
      let upto = -1;
      if (st.timings) {
        for (let j = 0; j < n; j++) if (st.timings[j] <= t + 0.05) upto = j;
      } else upto = Math.floor((t / dur) * n) - 1;
      if (upto !== st.upto) {
        st.wordEls.forEach((el, j) => {
          const state = j < upto ? "said" : j === upto ? "now" : "";
          if (el.dataset.s !== state) el.dataset.s = state;
        });
        st.upto = upto;
        const box = $("text"), el = st.wordEls[upto];
        if (el && box.scrollHeight > box.clientHeight + 4) box.scrollTo({ top: Math.max(0, el.offsetTop - box.offsetTop - box.clientHeight * 0.35), behavior: STILL.matches ? "auto" : "smooth" });
      }
      const k = Math.floor(t * 25);
      const level = st.playing && st.env.length ? (st.env[Math.min(k, st.env.length - 1)] || 0) / 100 : 0;
      bars.forEach((b, j) => {
        const e = st.playing && st.env.length ? (st.env[Math.max(0, Math.min(st.env.length - 1, k - (BARS - 1 - j)))] || 0) / 100 : 0;
        b.style.transform = `scaleY(${(0.12 + e * 0.88).toFixed(3)})`;
      });
      document.querySelectorAll(".guide .guide-avatar, .guide-launcher .guide-avatar").forEach((a) => a.style.setProperty("--lvl", level.toFixed(3)));
      placeRing();
      if (st.open) st.raf = requestAnimationFrame(loop);
    };
    st.raf = requestAnimationFrame(loop);
  }

  audio.addEventListener("play", () => setPlaying(true));
  audio.addEventListener("pause", () => setPlaying(false));
  audio.addEventListener("ended", () => {
    setPlaying(false);
    if (auto.checked && st.open && st.i < STEPS.length - 1) st.next = setTimeout(() => go(st.i + 1), 1700);
  });

  function stopClip() {
    clip.pause();
    if (clipBtn) {
      clipBtn.removeAttribute("data-playing");
      const l = clipBtn.querySelector("[data-intro-label]");
      if (l) l.textContent = clipBtn.dataset.label || l.textContent;
    }
    clipBtn = null;
  }
  api.playClip = (id, btn) => {
    if (clipBtn === btn && !clip.paused) {
      stopClip();
      return;
    }
    stopClip();
    if (st.open) audio.pause();
    clipBtn = btn;
    const l = btn.querySelector("[data-intro-label]");
    if (l) {
      btn.dataset.label = btn.dataset.label || l.textContent;
      l.textContent = "Пауза";
    }
    btn.setAttribute("data-playing", "");
    clip.src = `audio/guide/${id}.mp3`;
    clip.play().catch(stopClip);
  };
  clip.addEventListener("ended", stopClip);

  launcher.addEventListener("click", () => open());
  $("close").addEventListener("click", close);
  $("prev").addEventListener("click", () => go(st.i - 1));
  $("next").addEventListener("click", () => go(st.i + 1));
  $("play").addEventListener("click", () => {
    if (audio.paused) {
      if (audio.ended) audio.currentTime = 0;
      audio.play().catch(() => {});
    } else audio.pause();
  });
  $("dots").addEventListener("click", (e) => {
    const b = e.target.closest("[data-step]");
    if (b) go(+b.dataset.step);
  });
  document.addEventListener("keydown", (e) => {
    if (!st.open) return;
    if (e.key === "Escape") close();
  });
  addEventListener("resize", placeRing, { passive: true });
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-guide-start]");
    if (b) {
      e.preventDefault();
      open(0);
    }
    const l = e.target.closest("[data-guide-step]");
    if (l) open(+l.dataset.guideStep);
  });
  document.addEventListener("routed", () => {
    if (clipBtn && !clipBtn.isConnected) stopClip();
    const route = location.hash || "#/";
    const idx = STEPS.findIndex((s) => s.route === route && s.route.startsWith("#/t/"));
    const head = document.querySelector(".topic .chapter-head > div");
    if (idx >= 0 && head) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "listen-btn";
      b.dataset.guideStep = String(idx);
      b.innerHTML = `<span class="guide-avatar guide-avatar-sm" aria-hidden="true">${bars5}</span>Лина объясняет опыт`;
      head.appendChild(b);
    }
  });
  const body = document.body;
  return api;
})();

          <p class="eyebrow">Курс на 12 лет · ${TOPICS.length} тем · ${LABS.length} лабораторий</p>
          <h1>Физика,<br>которую можно<br><em>потрогать</em></h1>
          <p class="lead">От «твёрдое, жидкое, газ» в первом классе до матриц поворота и спина электрона в двенадцатом. Каждая тема — теория, формулы, опыт и вопрос. Приборы крутятся, числа на табло считаются честно, а гид Лина рассказывает голосом.</p>
          <div class="hero-cta">
            <a class="btn-primary" href="#/g/1">Начать с 1 класса</a>
            <button type="button" class="btn-ghost btn-guide" data-guide-start><span class="guide-avatar guide-avatar-sm" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Экскурсия с голосовым гидом</button>
          </div>
          <dl class="hero-stats">
            <div><dt>12</dt><dd>лет обучения</dd></div>
            <div><dt>${TOPICS.length}</dt><dd>тем</dd></div>
            <div><dt>${LABS.length}</dt><dd>живых лабораторий</dd></div>
          </dl>
        </div>
        <div class="hero-figure" data-figure="cradle"></div>
      </section>
      <section class="map course-map" id="map">
        <div class="section-head">
          <p class="eyebrow">Карта курса</p>
          <h2>Двенадцать лет физики</h2>
          <p>В каждом классе шесть основных тем, а в старших классах — ещё углублённые. Начальная школа знакомит с природой, основная строит механику, тепло и электричество, старшая — электродинамику и оптику, а профильный класс доходит до теории относительности, квантов и матриц.</p>
        </div>
        ${stages.map((s) => `<div class="stage"><p class="stage-name">${esc(s.name)}</p><div class="grade-grid">${s.grades.map(gradeCard).join("")}</div></div>`).join("")}
      </section>
      <section class="labs-strip">
        <div class="section-head">
          <p class="eyebrow">Лаборатории</p>
          <h2>Приборы, которые можно трогать</h2>
          <p>Изометрические приборы в стиле Anatomy и 3D-сцены, которые можно вращать пальцем.</p>
        </div>
        <div class="labs-grid">${LABS.map((t) => `<a class="lab-chip" href="#/t/${t.id}"><span class="lab-code">${t.code}</span><span class="lab-name">${esc(t.title)}</span>${badge(t)}</a>`).join("")}</div>
      </section>`;
    mountFigures();
    countUp();
  }

  function grade(n) {
    const g = COURSE.find((x) => x.n === n);
    if (!g) return home();
    const prev = COURSE.find((x) => x.n === n - 1), next = COURSE.find((x) => x.n === n + 1);
    app.innerHTML = `
      <nav class="crumbs"><a href="#/">Курс</a><span>/</span><span>${n} класс</span></nav>
      <section class="grade-head">
        <span class="chapter-num">${String(n).padStart(2, "0")}</span>
        <div>
          <p class="eyebrow">${esc(g.stage)} · ${n} класс</p>
          <h2>${esc(g.title)}</h2>
          <p class="grade-lead">${esc(g.blurb)}</p>
          <button type="button" class="listen-btn" data-intro="${n}"><span class="guide-avatar guide-avatar-sm" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span data-intro-label>Лина рассказывает о классе</span></button>
        </div>
      </section>
      <ol class="topic-list">${g.topics.map((t) => `<li${solved.has(t.id) ? " data-done" : ""}><a href="#/t/${t.id}"><span class="topic-code">${t.code}</span><span class="topic-main"><span class="topic-title">${esc(t.title)}</span><span class="topic-lead">${esc(t.lead)}</span></span>${badge(t)}<span class="topic-check" aria-hidden="true"></span></a></li>`).join("")}</ol>
      <nav class="pager">${prev ? `<a href="#/g/${prev.n}">← ${prev.n} класс · ${esc(prev.title)}</a>` : "<span></span>"}${next ? `<a href="#/g/${next.n}">${next.n} класс · ${esc(next.title)} →</a>` : "<span></span>"}</nav>`;
    const btn = app.querySelector("[data-intro]");
    btn.addEventListener("click", () => Guide.playClip(`grade${n}`, btn));
  }

  function topic(id) {
    const t = byId[id];
    if (!t) return home();
    const idx = TOPICS.indexOf(t);
    const prev = TOPICS[idx - 1], next = TOPICS[idx + 1];
    const figure = t.fig ? `<div class="topic-figure" data-figure="${t.fig}"></div>` : t.lab3d ? `<div class="topic-figure" data-lab3d="${t.lab3d}"></div>` : `<div class="topic-figure topic-board"><p class="eyebrow">Главная формула</p><div class="board-f">${t.formulas[0].f}</div><p class="board-note">${t.formulas[0].note || ""}</p>${t.formulas[1] ? `<div class="board-f board-f2">${t.formulas[1].f}</div><p class="board-note">${t.formulas[1].note || ""}</p>` : ""}<p class="board-hint">${esc(t.grade.n)} класс · ${esc(t.grade.title)}</p></div>`;
    app.innerHTML = `
      <nav class="crumbs"><a href="#/">Курс</a><span>/</span><a href="#/g/${t.grade.n}">${t.grade.n} класс</a><span>/</span><span>${t.code}</span></nav>
      <section class="chapter topic" id="t-${t.id}">
        <div class="chapter-head">
          <span class="chapter-num">${t.code}</span>
          <div>
            <p class="eyebrow">${t.grade.n} класс · ${esc(t.grade.title)}${t.deep ? " · углублённо" : ""}</p>
            <h2>${esc(t.title)}</h2>
          </div>
        </div>
        <div class="chapter-body">
          <div class="chapter-text">
            <p class="topic-lead-p">${esc(t.lead)}</p>
            ${t.body.map((p) => `<p>${p}</p>`).join("")}
            ${t.formulas.map(formulaHtml).join("")}
            <div class="try"><p class="try-title">${t.fig || t.lab3d ? "Опыт" : "Попробуй сам"}</p><ol>${t.tryIt.map((x) => `<li>${x}</li>`).join("")}</ol></div>
            <div class="quiz" data-quiz="${t.id}">
              <p class="quiz-q">${esc(t.quiz.q)}</p>
              ${t.quiz.opts.map((o, i) => `<button data-option="${i}">${esc(o)}</button>`).join("")}
              <p class="quiz-why" hidden>${esc(t.quiz.why)}</p>
            </div>
          </div>
          ${figure}
        </div>
      </section>
      <nav class="pager">${prev ? `<a href="#/t/${prev.id}">← ${prev.code} ${esc(prev.title)}</a>` : "<span></span>"}${next ? `<a href="#/t/${next.id}">${next.code} ${esc(next.title)} →</a>` : "<span></span>"}</nav>`;
    const quiz = app.querySelector(".quiz");
    const reveal = () => {
      quiz.querySelector(`[data-option="${t.quiz.answer}"]`).dataset.state = "right";
      quiz.querySelector(".quiz-why").hidden = false;
    };
    if (solved.has(t.id)) reveal();
    quiz.addEventListener("click", (e) => {
      const b = e.target.closest("[data-option]");
      if (!b) return;
      if (+b.dataset.option === t.quiz.answer) {
        reveal();
        solved.add(t.id);
        save();
        paintProgress();
      } else b.dataset.state = "wrong";
    });
    mountFigures(`${t.grade.n}.${t.i}`);
  }

  function mountFigures(num) {
    app.querySelectorAll("[data-figure]").forEach((el) => {
      const make = FIG[el.dataset.figure];
      if (!make) return;
      try {
        make(el, num || 1);
      } catch (err) {
        console.error(el.dataset.figure, err);
      }
    });
    app.querySelectorAll("[data-lab3d]").forEach((el) => Lab3D.mount(el, el.dataset.lab3d, num || 1));
  }

  function countUp() {
    app.querySelectorAll(".hero-stats dt").forEach((dt) => {
      const end = parseInt(dt.textContent, 10);
      if (!Number.isFinite(end) || end === 0 || STILL.matches) return;
      const t0 = performance.now() + 400;
      dt.textContent = "0";
      const step = (now) => {
        const u = Math.min(1, Math.max(0, (now - t0) / 1100));
        dt.textContent = String(Math.round(end * (1 - (1 - u) ** 3)));
        if (u < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }

  const reveal = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        const el = entry.target;
        el.setAttribute("data-in", "");
        reveal.unobserve(el);
        setTimeout(() => {
          el.classList.remove("reveal");
          el.removeAttribute("data-in");
          el.style.transitionDelay = "";
        }, 1100 + (parseFloat(el.style.transitionDelay) || 0));
      });
    },
    { rootMargin: "0px 0px -6% 0px" },
  );
  function animateIn() {
    app.querySelectorAll(".chapter-head, .grade-head, .section-head, .topic-figure, .stage, .labs-grid").forEach((el) => {
      el.classList.add("reveal");
      reveal.observe(el);
    });
    app.querySelectorAll(".chapter-text > *, .topic-list > li, .grade-grid > a").forEach((el) => {
      el.classList.add("reveal");
      el.style.transitionDelay = `${Math.min([...el.parentElement.children].indexOf(el), 8) * 60}ms`;
      reveal.observe(el);
    });
  }

  let current = "";
  function route() {
    const h = location.hash || "#/";
    if (h === current) return;
    current = h;
    const m = h.match(/^#\/(g|t)\/([\w-]+)/);
    const draw = () => {
      if (m && m[1] === "g") grade(+m[2]);
      else if (m && m[1] === "t") topic(m[2]);
      else home();
      gradeNav.querySelectorAll("a").forEach((a) => {
        const n = m ? +String(m[2]).split("-")[0] : 0;
        a.toggleAttribute("data-active", +a.dataset.nav === n);
      });
      paintProgress();
      animateIn();
      if (!Guide.navigating) window.scrollTo({ top: 0, behavior: "auto" });
      document.dispatchEvent(new CustomEvent("routed"));
    };
    if (document.startViewTransition && !STILL.matches && app.childElementCount) document.startViewTransition(draw);
    else draw();
  }
  addEventListener("hashchange", route);
  window.Site = { route, TOPICS, byId, COURSE, GRADE_WORD };

  const line = document.querySelector("[data-scroll-line]");
  const onScroll = () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    line.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
  };
  addEventListener("scroll", onScroll, { passive: true });
  route();
  onScroll();
})();
</script>
</body>
</html>
