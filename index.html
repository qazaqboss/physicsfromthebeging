<style>.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px;color-scheme:light}
body[data-theme="dark"]{color-scheme:dark}
.iso{--anatomy-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
body{
  margin:0;background:var(--anatomy-page);color:var(--anatomy-text);
  font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  --rule:color-mix(in srgb,var(--anatomy-mid) 35%,transparent);
  --accent:var(--anatomy-strong);
  --grid:color-mix(in srgb,var(--anatomy-mid) 9%,transparent);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed;
}
a{color:inherit}
b{color:var(--anatomy-strong);font-weight:600}
h1,h2{font-family:"Inter Tight",Inter,sans-serif;color:var(--anatomy-strong);letter-spacing:-.025em;margin:0}
.eyebrow{font-family:var(--anatomy-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--anatomy-muted);margin:0 0 12px}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;height:56px;padding:0 24px;
  background:color-mix(in srgb,var(--anatomy-page) 82%,transparent);backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Inter Tight",sans-serif;font-weight:600;color:var(--anatomy-strong);white-space:nowrap}
.brand-dim{color:var(--anatomy-muted);font-weight:500}
.brand-mark{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--anatomy-strong);position:relative}
.brand-mark::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--anatomy-strong)}
.chapters-nav{display:flex;gap:2px;margin-left:auto;font-family:var(--anatomy-mono);font-size:12px}
.chapters-nav a{text-decoration:none;padding:5px 8px;border-radius:6px;color:var(--anatomy-muted);transition:color .2s,background .2s}
.chapters-nav a:hover{color:var(--anatomy-strong)}
.chapters-nav a[data-active]{color:var(--anatomy-strong);background:color-mix(in srgb,var(--anatomy-mid) 16%,transparent)}
.chapters-nav a[data-done]::after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--anatomy-green);margin-left:4px;vertical-align:middle}
.topbar-right{display:flex;align-items:center;gap:10px}
.progress-pill{font-family:var(--anatomy-mono);font-size:12px;color:var(--anatomy-text);padding:4px 10px;border:1px solid var(--rule);border-radius:99px;background:var(--anatomy-card)}
.theme-toggle{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:var(--anatomy-card);cursor:pointer;display:grid;place-items:center}
.theme-toggle span{width:14px;height:14px;border-radius:50%;background:linear-gradient(90deg,var(--anatomy-strong) 50%,transparent 50%);box-shadow:0 0 0 1.5px var(--anatomy-strong)}
.scroll-line{position:absolute;left:0;right:0;bottom:-1px;height:1px}
.scroll-line span{display:block;height:100%;width:100%;background:var(--anatomy-strong);transform:scaleX(0);transform-origin:left;will-change:transform}

main{width:min(1240px,100% - 32px);margin:0 auto}

.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center;padding:72px 0 56px;min-height:calc(100vh - 56px)}
.hero h1{font-size:clamp(44px,6.4vw,84px);line-height:.98;font-weight:600}
.hero h1 em{font-style:normal;position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.06em;height:.09em;background:var(--anatomy-strong);transform-origin:left;animation:underline 1.2s .4s cubic-bezier(.32,.72,0,1) both}
@keyframes underline{from{transform:scaleX(0)}}
.lead{font-size:18px;max-width:34em;margin:24px 0 32px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px}
.btn-primary,.btn-ghost{display:inline-flex;align-items:center;height:44px;padding:0 20px;border-radius:99px;text-decoration:none;font-weight:500;font-size:15px;transition:transform .2s,box-shadow .2s}
.btn-primary{background:var(--anatomy-strong);color:var(--anatomy-page)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px -6px #0006}
.btn-ghost{border:1px solid var(--rule);color:var(--anatomy-strong);background:var(--anatomy-card)}
.hero-stats{display:flex;gap:36px;margin:40px 0 0}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats dt{font-family:"Inter Tight",sans-serif;font-size:32px;font-weight:600;color:var(--anatomy-strong);line-height:1.1}
.hero-stats dd{margin:0;font-size:13px;color:var(--anatomy-muted)}
.hero-figure .iso-figure{margin:0}
.hero-figure{animation:rise 1.4s .15s cubic-bezier(.22,1,.36,1) both}
.hero-text>*{animation:rise 1.1s cubic-bezier(.22,1,.36,1) both}
.hero-text>:nth-child(2){animation-delay:.08s}.hero-text>:nth-child(3){animation-delay:.16s}.hero-text>:nth-child(4){animation-delay:.24s}.hero-text>:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.985)}}
.iso-plate{transition:box-shadow .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1)}
.chapter-figure .iso-plate:hover,.hero-figure .iso-plate:hover{box-shadow:0 0 0 1px var(--anatomy-strong),0 24px 48px -28px #0004}
::view-transition-old(root),::view-transition-new(root){animation-duration:.55s;animation-timing-function:cubic-bezier(.22,1,.36,1)}

.section-head{max-width:640px;margin-bottom:32px}
.section-head h2,.finale h2{font-size:clamp(30px,3.6vw,44px);line-height:1.08;margin-bottom:12px}
.map{padding:56px 0 24px}
.map-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--anatomy-mid);box-shadow:0 0 0 1px var(--anatomy-mid)}
.map-grid a{display:grid;gap:6px;padding:22px 20px 24px;background:var(--anatomy-card);text-decoration:none;height:100%;transition:background .35s}
.map-name{transition:transform .45s cubic-bezier(.22,1,.36,1)}
.map-grid a:hover .map-name{transform:translateX(4px)}
.map-grid a:hover{background:var(--anatomy-page)}
.map-num{font-family:var(--anatomy-mono);font-size:11px;color:var(--anatomy-muted)}
.map-name{font-family:"Inter Tight",sans-serif;font-size:21px;font-weight:600;color:var(--anatomy-strong);letter-spacing:-.01em}
.map-law{font-family:var(--anatomy-mono);font-size:13px;color:var(--anatomy-text)}
.map-tool{font-size:13px;color:var(--anatomy-muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.map-grid li[data-done] .map-num::after{content:" · решено";color:var(--anatomy-green)}

.chapter{padding:96px 0 40px;border-top:1px solid var(--rule);margin-top:56px}
.chapter-head{display:flex;gap:28px;align-items:flex-start;margin-bottom:40px}
.chapter-num{font-family:"Inter Tight",sans-serif;font-size:clamp(64px,8vw,112px);line-height:.8;font-weight:600;color:transparent;-webkit-text-stroke:1px var(--anatomy-mid);letter-spacing:-.04em}
.chapter-head h2{font-size:clamp(30px,3.8vw,48px);line-height:1.05}
.chapter-body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start}
.chapter:nth-of-type(even) .chapter-body{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.chapter:nth-of-type(even) .chapter-figure{order:-1}
.chapter-text{max-width:36em}
.chapter-text p{margin:0 0 16px}
.chapter-figure{position:sticky;top:80px}
.chapter-figure .iso-figure{margin:0}

.formula{display:flex;flex-direction:column;gap:6px;margin:22px 0;padding:18px 22px;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);position:relative}
.formula::before,.formula::after{content:"";position:absolute;width:6px;height:6px;border:1px solid var(--anatomy-mid);background:var(--anatomy-page);border-radius:50%}
.formula::before{left:-4px;top:-4px}.formula::after{right:-4px;bottom:-4px}
.formula.small{padding:14px 18px}
.f-main{font-family:"Inter Tight",sans-serif;font-size:26px;color:var(--anatomy-strong);font-weight:500;letter-spacing:-.01em;display:flex;align-items:center;flex-wrap:wrap;gap:.25em}
.formula.small .f-main{font-size:21px}
.f-note{font-family:var(--anatomy-mono);font-size:11.5px;color:var(--anatomy-muted);letter-spacing:.02em}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-size:.72em;line-height:1.15;vertical-align:middle}
.frac span:first-child{border-bottom:1px solid currentColor;padding:0 .2em .08em}
.frac span:last-child{padding:.08em .2em 0}
.sqrt{border-top:1px solid currentColor;padding:0 .15em;margin-left:-.1em}

.try{margin:26px 0;padding:18px 22px;border-left:2px solid var(--anatomy-strong);background:color-mix(in srgb,var(--anatomy-card) 70%,transparent)}
.try-title{font-family:var(--anatomy-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--anatomy-strong);margin:0 0 8px!important}
.try ol{margin:0;padding-left:20px}
.try li{margin:4px 0}

.quiz{margin-top:28px;padding:20px 22px 22px;border:1px dashed var(--anatomy-mid);display:flex;flex-wrap:wrap;gap:8px}
.quiz-q{width:100%;margin:0 0 8px!important;color:var(--anatomy-strong);font-weight:500}
.quiz-q::before{content:"Проверь себя";display:block;font-family:var(--anatomy-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--anatomy-muted);font-weight:400;margin-bottom:6px}
.quiz button{font:500 14px/1 var(--anatomy-mono);padding:10px 14px;border-radius:99px;border:1px solid var(--rule);background:var(--anatomy-card);color:var(--anatomy-strong);cursor:pointer;transition:all .2s}
.quiz button:hover{border-color:var(--anatomy-strong)}
@keyframes pop{40%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.quiz button[data-state="wrong"]{animation:shake .4s}
.quiz-why:not([hidden]){animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.quiz button[data-state="right"]{animation:pop .45s cubic-bezier(.22,1,.36,1);background:var(--anatomy-green);border-color:var(--anatomy-green);color:#fff}
.quiz button[data-state="wrong"]{border-color:var(--anatomy-red);color:var(--anatomy-red);text-decoration:line-through}
.quiz-why{width:100%;margin:10px 0 0!important;font-size:14.5px;padding-top:12px;border-top:1px solid var(--rule)}

.lab-controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
.lab-row{display:flex;align-items:center;gap:10px}
.lab-range{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:200px}
.lab-range-label{font-family:var(--anatomy-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--anatomy-muted);white-space:nowrap}
.lab-range output{font-family:var(--anatomy-mono);font-size:12px;color:var(--anatomy-strong);min-width:4.5em;text-align:right;font-variant-numeric:tabular-nums}
.lab-range input{flex:1;-webkit-appearance:none;appearance:none;height:20px;background:transparent;cursor:pointer;min-width:80px}
.lab-range input::-webkit-slider-runnable-track{height:2px;background:var(--anatomy-mid)}
.lab-range input::-moz-range-track{height:2px;background:var(--anatomy-mid)}
.lab-range input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;margin-top:-7px;background:var(--anatomy-card);border:1.5px solid var(--anatomy-strong);box-shadow:0 1px 3px #0003}
.lab-range input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--anatomy-card);border:1.5px solid var(--anatomy-strong)}
.lab-btn{font:500 12px/1 var(--anatomy-mono);letter-spacing:.06em;text-transform:uppercase;height:34px;padding:0 16px;border-radius:99px;border:1px solid var(--anatomy-mid);background:var(--anatomy-card);color:var(--anatomy-strong);cursor:pointer;transition:all .2s}
.lab-btn:hover{border-color:var(--anatomy-strong)}
.lab-btn[data-primary]{background:var(--anatomy-strong);color:var(--anatomy-card);border-color:var(--anatomy-strong)}
.lab-btn[data-primary]:hover{transform:translateY(-1px)}
.lab-seg{display:inline-flex;border:1px solid var(--anatomy-mid);border-radius:99px;padding:2px}
.lab-seg button{font:500 12px/1 var(--anatomy-mono);border:0;background:transparent;color:var(--anatomy-text);padding:7px 11px;border-radius:99px;cursor:pointer}
.lab-seg button[aria-checked="true"]{background:var(--anatomy-strong);color:var(--anatomy-card)}
.iso-stage{outline:none;touch-action:pan-y}
.iso-stage:focus-visible{box-shadow:0 0 0 1px var(--anatomy-strong)}
.iso-caption{color:var(--anatomy-text)}
.iso-plate-corner[data-corner="readout"]{max-width:70%;text-align:right;white-space:normal}

.finale{margin:96px 0 0;padding:72px 0;border-top:1px solid var(--rule)}
.cheat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}
.cheat a{display:grid;gap:4px;padding:18px;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);text-decoration:none;transition:transform .2s}
.cheat a:hover{transform:translateY(-2px)}
.cheat b{font-family:var(--anatomy-mono);font-size:15px;font-weight:500}
.cheat span{font-size:13px;color:var(--anatomy-muted)}
.footer{width:min(1240px,100% - 32px);margin:0 auto;padding:32px 0 56px;border-top:1px solid var(--rule);font-size:14px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.footer p{margin:0}.footer-dim{color:var(--anatomy-muted);max-width:40em}

.reveal{opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.22,1,.36,1),transform 1s cubic-bezier(.22,1,.36,1)}
.reveal[data-in]{opacity:1;transform:none}

@media (max-width:1020px){
  .hero,.chapter-body,.chapter:nth-of-type(even) .chapter-body{grid-template-columns:1fr}
  .chapter:nth-of-type(even) .chapter-figure{order:0}
  .chapter-figure{position:static}
  .hero{min-height:0;padding-top:48px}
  .map-grid,.cheat{grid-template-columns:repeat(2,1fr)}
  .chapters-nav{display:none}
  .topbar-right{margin-left:auto}
}
@media (max-width:560px){
  .topbar{padding:0 16px}
  .brand-dim{display:none}
  .map-grid,.cheat{grid-template-columns:1fr}
  .chapter-head{gap:16px}
  .chapter{padding-top:64px}
  .hero-stats{gap:24px}
  .f-main{font-size:22px}
  .lab-range{min-width:100%}
  .iso-plate{padding-bottom:64px}
  .iso-plate-corner[data-corner="hint"]{display:none}
  .iso-plate-corner[data-corner="readout"]{max-width:none;left:0;text-align:left}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}.hero h1 em::after,.hero-figure,.hero-text>*,.quiz button,.quiz-why{animation:none!important}}

.iso-layers{position:relative}
.iso-layers>svg+svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.iso-stage[data-running] .iso-layers>svg{will-change:transform}
@media (max-width:1020px),(pointer:coarse){
  body{background-attachment:scroll}
  .topbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--anatomy-page)}
}
@media (pointer:coarse){
  .lab-seg button{padding:11px 14px;min-width:40px}
  .lab-btn{height:42px;padding:0 20px}
  .lab-range input{height:36px}
  .lab-range input::-webkit-slider-thumb{width:24px;height:24px;margin-top:-11px}
  .lab-range input::-moz-range-thumb{width:22px;height:22px}
  .quiz button{padding:13px 16px}
  .iso-plate:hover{box-shadow:0 0 0 1px var(--anatomy-mid)!important}
}
html{-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.lab-controls button,.lab-range input,.quiz button{touch-action:manipulation}

/* ---------- голосовой гид ---------- */
.btn-guide{gap:10px;cursor:pointer;font:inherit;font-weight:500;font-size:15px}
.guide-avatar{--lvl:0;display:inline-flex;align-items:center;justify-content:center;gap:2px;width:38px;height:38px;border-radius:50%;background:var(--anatomy-strong);flex:none;position:relative}
.guide-avatar::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--anatomy-strong);opacity:calc(.15 + var(--lvl) * .8);transform:scale(calc(1 + var(--lvl) * .22));transition:transform .08s linear,opacity .08s linear}
.guide-avatar i{display:block;width:2.5px;border-radius:2px;background:var(--anatomy-card);height:30%;transform-origin:center}
.guide-avatar i:nth-child(1),.guide-avatar i:nth-child(5){height:22%}
.guide-avatar i:nth-child(3){height:46%}
[data-playing] .guide-avatar i,.guide[data-playing] .guide-avatar i{animation:talk .9s ease-in-out infinite}
.guide-avatar i:nth-child(2){animation-delay:-.2s!important}.guide-avatar i:nth-child(3){animation-delay:-.45s!important}.guide-avatar i:nth-child(4){animation-delay:-.1s!important}.guide-avatar i:nth-child(5){animation-delay:-.6s!important}
@keyframes talk{0%,100%{transform:scaleY(.7)}50%{transform:scaleY(1.6)}}
.guide-avatar-sm{width:24px;height:24px;gap:1.5px}
.guide-avatar-sm i{width:2px}
.guide-avatar-sm::after{inset:-3px;border-width:1px}
.guide-avatar-lg{width:44px;height:44px}

.guide-launcher{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:99px;border:1px solid var(--rule);background:var(--anatomy-card);color:var(--anatomy-strong);cursor:pointer;font:inherit;box-shadow:0 10px 30px -12px #0005,0 0 0 1px var(--anatomy-mid);transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .4s}
.guide-launcher:hover{transform:translateY(-2px)}
.guide-launcher[data-hidden]{transform:translateY(140%);opacity:0;pointer-events:none}
.guide-launcher-text{display:grid;text-align:left;line-height:1.2}
.guide-launcher-text b{font-family:"Inter Tight",sans-serif;font-size:15px}
.guide-launcher-text span{font-family:var(--anatomy-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--anatomy-muted)}
.guide-launcher .guide-avatar{animation:beckon 3.2s 2s ease-in-out infinite}
@keyframes beckon{0%,80%,100%{transform:none}86%{transform:scale(1.12)}92%{transform:scale(.96)}}

.guide{position:fixed;right:20px;bottom:20px;z-index:41;width:min(420px,calc(100vw - 32px));background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid),0 30px 60px -24px #0006;padding:16px 18px 14px;opacity:0;transform:translateY(24px) scale(.98);transition:opacity .45s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1)}
.guide[data-in]{opacity:1;transform:none}
.guide[data-side="left"]{right:auto;left:20px}
.guide-auto input{accent-color:var(--anatomy-strong);width:15px;height:15px}
.guide::before{content:"";position:absolute;left:-4px;top:-4px;width:6px;height:6px;border-radius:50%;border:1px solid var(--anatomy-mid);background:var(--anatomy-page)}
.guide-head{display:flex;align-items:center;gap:12px}
.guide-who{display:grid;line-height:1.25;min-width:0}
.guide-who b{font-family:"Inter Tight",sans-serif;font-size:16px;color:var(--anatomy-strong)}
.guide-who span{font-family:var(--anatomy-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--anatomy-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guide-count{margin-left:auto;font-family:var(--anatomy-mono);font-size:11.5px;color:var(--anatomy-muted)}
.guide-x{width:32px;height:32px;border-radius:50%;border:1px solid var(--rule);background:transparent;color:var(--anatomy-text);cursor:pointer}
.guide-wave{display:flex;align-items:center;gap:3px;height:34px;margin:12px 0 6px}
.guide-wave i{flex:1;height:100%;border-radius:2px;background:var(--anatomy-strong);opacity:.75;transform:scaleY(.12);transition:transform .07s linear}
.guide-text{margin:6px 0 10px;font-size:15.5px;line-height:1.6;color:var(--anatomy-muted);max-height:9.6em;overflow:auto;scrollbar-width:thin}
.guide-text span{transition:color .25s}
.guide-text span[data-s="said"]{color:var(--anatomy-text)}
.guide-text span[data-s="now"]{color:var(--anatomy-strong);background:color-mix(in srgb,var(--anatomy-mid) 22%,transparent);border-radius:3px;box-shadow:0 0 0 2px color-mix(in srgb,var(--anatomy-mid) 22%,transparent)}
.guide-bar{height:2px;background:var(--rule);margin-bottom:12px}
.guide-bar span{display:block;height:100%;background:var(--anatomy-strong);transform:scaleX(0);transform-origin:left}
.guide-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.guide-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--anatomy-mid);background:var(--anatomy-card);color:var(--anatomy-strong);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.guide-btn:disabled{opacity:.35;cursor:default}
.guide-play{width:46px;height:46px;background:var(--anatomy-strong);border-color:var(--anatomy-strong)}
.guide-play span{width:0;height:0;border-left:12px solid var(--anatomy-card);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.guide[data-playing] .guide-play span{width:12px;height:14px;border:0;margin:0;background:linear-gradient(90deg,var(--anatomy-card) 0 35%,transparent 35% 65%,var(--anatomy-card) 65%)}
.guide-auto{display:flex;align-items:center;gap:5px;font-family:var(--anatomy-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--anatomy-muted);cursor:pointer;margin-left:4px}
.guide-dots{display:flex;gap:4px;margin-left:auto}
.guide-dots button{width:7px;height:7px;padding:0;border-radius:50%;border:0;background:var(--anatomy-faint);cursor:pointer;transition:all .3s}
.guide-dots button[data-done]{background:var(--anatomy-mid)}
.guide-dots button[data-on]{background:var(--anatomy-strong);width:18px;border-radius:4px}

.guide-ring{position:fixed;left:0;top:0;z-index:30;pointer-events:none;border-radius:4px;box-shadow:0 0 0 2px var(--anatomy-strong),0 0 0 9999px color-mix(in srgb,var(--anatomy-page) 38%,transparent);transition:transform .7s cubic-bezier(.22,1,.36,1),width .7s cubic-bezier(.22,1,.36,1),height .7s cubic-bezier(.22,1,.36,1);animation:ringpulse 2.4s ease-in-out infinite}
@keyframes ringpulse{50%{box-shadow:0 0 0 4px var(--anatomy-strong),0 0 0 9999px color-mix(in srgb,var(--anatomy-page) 38%,transparent)}}

.listen-btn{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:6px 16px 6px 6px;border-radius:99px;border:1px solid var(--rule);background:var(--anatomy-card);color:var(--anatomy-strong);font:500 14px/1 Inter,sans-serif;cursor:pointer;transition:border-color .3s,transform .3s}
.listen-btn:hover{border-color:var(--anatomy-strong);transform:translateY(-1px)}

@media (max-width:560px){
  .guide{right:0;left:0;bottom:0;width:100%;padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0}
  .guide::before{display:none}
  .guide-text{max-height:6.4em;font-size:15px}
  .guide-launcher{right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding-right:14px}
  .guide-launcher-text span{display:none}
  .guide-dots{display:none}
  body[data-guide] .footer{padding-bottom:260px}
}
@media (prefers-reduced-motion:reduce){.guide-ring,.guide-avatar i,.guide-launcher .guide-avatar{animation:none!important}}

/* ---------- курс: карта, класс, тема ---------- */
#app{outline:none;min-height:70vh}
.crumbs{display:flex;gap:10px;align-items:center;padding:28px 0 0;font-family:var(--anatomy-mono);font-size:12px;color:var(--anatomy-muted);letter-spacing:.04em}
.crumbs a{color:var(--anatomy-text);text-decoration:none}
.crumbs a:hover{color:var(--anatomy-strong)}
.course-map{padding-top:72px}
.stage{margin-top:40px}
.stage-name{font-family:var(--anatomy-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--anatomy-muted);margin:0 0 14px;display:flex;align-items:center;gap:14px}
.stage-name::after{content:"";flex:1;height:1px;background:var(--rule)}
.grade-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--anatomy-mid);box-shadow:0 0 0 1px var(--anatomy-mid)}
.grade-card{position:relative;display:flex;flex-direction:column;gap:6px;padding:22px 20px 20px;background:var(--anatomy-card);text-decoration:none;min-height:230px;overflow:hidden;transition:background .35s}
.grade-card:hover{background:var(--anatomy-page)}
.grade-num{position:absolute;right:14px;top:6px;font-family:"Inter Tight",sans-serif;font-size:84px;font-weight:600;line-height:1;color:transparent;-webkit-text-stroke:1px var(--anatomy-faint);transition:-webkit-text-stroke-color .35s,transform .5s cubic-bezier(.22,1,.36,1)}
.grade-card:hover .grade-num{-webkit-text-stroke-color:var(--anatomy-mid);transform:translateY(-3px)}
.grade-meta{font-family:var(--anatomy-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--anatomy-muted)}
.grade-title{font-family:"Inter Tight",sans-serif;font-size:21px;font-weight:600;color:var(--anatomy-strong);letter-spacing:-.01em;margin-top:28px;position:relative}
.grade-blurb{font-size:13.5px;line-height:1.5;color:var(--anatomy-text);position:relative}
.grade-foot{margin-top:auto;padding-top:14px;display:grid;gap:8px;font-family:var(--anatomy-mono);font-size:11px;color:var(--anatomy-muted)}
.grade-bar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
.grade-bar i{display:block;height:100%;background:var(--anatomy-green);transition:width .6s}
.labs-strip{padding:88px 0 24px}
.labs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lab-chip{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);text-decoration:none;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.lab-chip:hover{transform:translateY(-2px)}
.lab-code{font-family:var(--anatomy-mono);font-size:12px;color:var(--anatomy-muted);min-width:2.6em}
.lab-name{flex:1;color:var(--anatomy-strong);font-weight:500;font-size:14.5px}
.tag{font-family:var(--anatomy-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--anatomy-mid);color:var(--anatomy-text);white-space:nowrap}
.tag-3d{background:var(--anatomy-strong);color:var(--anatomy-card);border-color:var(--anatomy-strong)}
.grade-head{display:flex;gap:28px;align-items:flex-start;padding:40px 0 36px}
.grade-head h2{font-size:clamp(34px,4.4vw,56px);line-height:1.02}
.grade-lead{font-size:17px;max-width:38em;margin:14px 0 0}
.topic-list{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--anatomy-mid);box-shadow:0 0 0 1px var(--anatomy-mid)}
.topic-list a{display:flex;align-items:center;gap:20px;padding:20px 22px;background:var(--anatomy-card);text-decoration:none;transition:background .3s}
.topic-list a:hover{background:var(--anatomy-page)}
.topic-code{font-family:"Inter Tight",sans-serif;font-size:28px;font-weight:600;color:transparent;-webkit-text-stroke:1px var(--anatomy-mid);min-width:2.6em}
.topic-main{flex:1;display:grid;gap:4px}
.topic-title{font-family:"Inter Tight",sans-serif;font-size:19px;font-weight:600;color:var(--anatomy-strong)}
.topic-lead{font-size:14px;color:var(--anatomy-text);line-height:1.5}
.topic-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--anatomy-faint);flex:none}
.topic-list li[data-done] .topic-check{background:var(--anatomy-green);border-color:var(--anatomy-green);box-shadow:inset 0 0 0 4px var(--anatomy-card)}
.pager{display:flex;justify-content:space-between;gap:16px;padding:48px 0 24px;flex-wrap:wrap}
.pager a{font-family:var(--anatomy-mono);font-size:12.5px;color:var(--anatomy-strong);text-decoration:none;padding:12px 18px;border:1px solid var(--rule);border-radius:99px;background:var(--anatomy-card);transition:border-color .3s}
.pager a:hover{border-color:var(--anatomy-strong)}
.topic{border-top:0;margin-top:0;padding-top:28px}
.topic .chapter-num{font-size:clamp(56px,7vw,96px)}
.topic-lead-p{font-size:18px;color:var(--anatomy-strong);line-height:1.55}
.chapter-text code{font-family:var(--anatomy-mono);font-size:13px;background:var(--anatomy-card);padding:2px 6px;box-shadow:0 0 0 1px var(--rule);display:inline-block;margin-top:6px}
.topic-board{padding:44px 32px;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);text-align:center;position:relative;overflow:hidden;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.board-f{font-family:"Inter Tight",sans-serif;font-size:clamp(30px,3.6vw,46px);font-weight:500;color:var(--anatomy-strong);letter-spacing:-.01em;margin:18px 0 6px;line-height:1.15}
.board-f2{font-size:clamp(22px,2.4vw,30px);margin-top:28px}
.board-note{font-family:var(--anatomy-mono);font-size:12px;color:var(--anatomy-muted);margin:0}
.board-hint{font-family:var(--anatomy-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--anatomy-muted);margin:36px 0 0}

/* ---------- 3D-лаборатории ---------- */
.lab3d-stage{position:relative}
.lab3d-canvas{display:block;width:100%;cursor:grab}
.lab3d-canvas:active{cursor:grabbing}
.lab3d-drag{position:absolute;left:0;top:0;font-family:var(--anatomy-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--anatomy-muted);transition:opacity .6s;pointer-events:none}
.lab3d-hud{position:absolute;right:0;top:0;display:grid;gap:8px;justify-items:end;pointer-events:none;font-family:var(--anatomy-mono);font-size:12px;color:var(--anatomy-strong)}
.lab3d-loading{padding:80px 20px;text-align:center;font-family:var(--anatomy-mono);font-size:12px;color:var(--anatomy-muted);background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid)}
.mtx{border-collapse:collapse;position:relative;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--anatomy-card) 85%,transparent)}
.mtx td{padding:3px 8px;text-align:right;min-width:3.4em}
.mtx::before,.mtx::after{content:"";position:absolute;top:0;bottom:0;width:6px;border:1.5px solid var(--anatomy-strong)}
.mtx::before{left:0;border-right:0}.mtx::after{right:0;border-left:0}
.mtx.sm td{padding:1px 5px;min-width:1.6em;text-align:center}
.mtx-wrap{display:flex;align-items:center;gap:8px}
.mtx-label{color:var(--anatomy-muted);margin-right:4px}
.mtx-sub{font-size:11px;color:var(--anatomy-muted)}
.mtx-row{display:flex;gap:12px;align-items:center;font-size:11px}
.mtx-row>div{display:flex;align-items:center}
.ket{font-size:13px;background:color-mix(in srgb,var(--anatomy-card) 85%,transparent);padding:2px 4px}
.prob{display:flex;align-items:center;gap:8px;font-size:11px}
.prob i{width:110px;height:6px;background:var(--rule);display:block}
.prob b{display:block;height:100%;background:var(--anatomy-strong);transition:width .2s}
.lab-check{text-transform:none;letter-spacing:0;font-size:12px}
@media (max-width:1020px){.grade-grid{grid-template-columns:repeat(2,1fr)}.lab3d-hud{position:static;justify-items:start;margin-top:10px}}
@media (max-width:560px){.grade-grid{grid-template-columns:1fr}.grade-card{min-height:0}.topic-list a{padding:16px;gap:14px}.topic-code{font-size:22px}.grade-head{gap:16px}.pager a{width:100%;text-align:center}.mtx td{padding:2px 5px;min-width:2.8em}}
.grade-grid{gap:12px;background:none;box-shadow:none}
.grade-card{box-shadow:0 0 0 1px var(--anatomy-mid)}
.iso-plate:has(.lab3d-stage) [data-corner="hint"]{display:none}
.iso-plate:has(.lab3d-stage) [data-corner="readout"]{max-width:100%}
@media (max-width:560px){
  .topic-list a{align-items:flex-start}
  .topic-code{min-width:0;font-size:20px;line-height:1.3}
  .topic-list .tag{display:none}
  .topic-check{margin-top:4px}
  .grade-num{font-size:64px}
}
.tag-deep{border-style:dashed}
.topic-list a .tag+.tag{margin-left:-12px}

    } else if (run) {
      runs.push(run);
      run = null;
    }
  }
  if (run) runs.push(run);
  return runs;
}

function groupsOf(keys) {
  const count = keys.length;
  const out = [];
  const start = keys.findIndex((key, index) => key !== keys[(index + count - 1) % count]);
  if (start < 0) {
    if (keys[0] !== null) out.push({ key: keys[0], run: Array.from({ length: count + 1 }, (_, index) => index % count) });
    return out;
  }
  let current = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    const key = keys[index];
    if (current && current.key === key) {
      current.run.push((index + 1) % count);
      continue;
    }
    if (current && current.key !== null) out.push(current);
    current = { key, run: [index, (index + 1) % count] };
  }
  if (current && current.key !== null) out.push(current);
  return out;
}

const stepsFor = (radius, least = 16, most = 112, scale = 0) => Math.max(least, Math.min(most, scale ? Math.ceil((TAU * radius * scale) / 3) : Math.round((radius * 1.3) / 4) * 4));

function chains(edges) {
  const out = [];
  let current = null;
  for (const [a, b, keep] of edges) {
    if (!keep) {
      if (current) out.push(current);
      current = null;
      continue;
    }
    if (!current) current = [a];
    current.push(b);
  }
  if (current) out.push(current);
  if (out.length > 1 && edges[0][2] && edges[edges.length - 1][2]) {
    const last = out.pop();
    out[0] = [...last, ...out[0].slice(1)];
  }
  return out;
}

function labelledArcs(nr, na, view, light, gr = nr, ga = na) {
  const cuts = [];
  if (Math.abs(gr) > 1e-9) {

    if (visibleCut > -1 && visibleCut < 1) {
      const d = Math.acos(visibleCut);
      cuts.push(view.phi - d, view.phi + d);
    }
  }
  if (Math.abs(nr) > 1e-9) {
    for (const threshold of BANDS) {
      const c = (threshold - na * light.a) / (nr * light.flat);
      if (c > -1 && c < 1) {
        const d = Math.acos(c);
        cuts.push(light.phi - d, light.phi + d);
      }

  }
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const sorted = [...new Set(cuts.map((angle) => Math.round(wrap(angle) * 1e9) / 1e9))].sort((a, b) => a - b);
  const label = (angle) => {
    const facing = gr * view.flat * Math.cos(angle - view.phi) + ga * view.a;
    if (facing <= 1e-9) return -1;
    return bandOf(nr * light.flat * Math.cos(angle - light.phi) + na * light.a);
  };
  if (!sorted.length) {
    const tone = label(0);
    return tone < 0 ? [] : [{ tone, from: 0, to: TAU, full: true }];
  }
  const arcs = sorted.map((from, index) => {
    const to = index + 1 < sorted.length ? sorted[index + 1] : sorted[0] + TAU;
    return { tone: label((from + to) / 2), from, to };
  });
  const merged = [];
  for (const arc of arcs) {
    const last = merged[merged.length - 1];
    if (last && last.tone === arc.tone && Math.abs(last.to - arc.from) < 1e-9) last.to = arc.to;
    else merged.push({ ...arc });
  }
  if (merged.length > 1 && merged[0].tone === merged[merged.length - 1].tone && Math.abs(merged[merged.length - 1].to - TAU - merged[0].from) < 1e-9) {
    const last = merged.pop();
    merged[0].from = last.from - TAU;
  }
  return merged.filter((arc) => arc.tone >= 0);
}

function hermiteSlopes(run) {
  const n = run.length - 1;
  const h = Array.from({ length: n }, (_, j) => run[j + 1][0] - run[j][0]);
  const delta = h.map((value, j) => (run[j + 1][1] - run[j][1]) / value);
  const d = new Array(n + 1).fill(0);
  const end = (h0, h1, d0, d1) => {
    let value = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (Math.sign(value) !== Math.sign(d0)) value = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(value) > Math.abs(3 * d0)) value = 3 * d0;
    return value;
  };
  if (n === 1) d[0] = d[1] = delta[0];
  else {
    d[0] = end(h[0], h[1], delta[0], delta[1]);
    d[n] = end(h[n - 1], h[n - 2], delta[n - 1], delta[n - 2]);
  }
  for (let k = 1; k < n; k++) {
    if (delta[k - 1] * delta[k] <= 0) continue;
    const w1 = 2 * h[k] + h[k - 1];
    const w2 = h[k] + 2 * h[k - 1];
    d[k] = (w1 + w2) / (w1 / delta[k - 1] + w2 / delta[k]);
  }
  return d;
}

function curveRuns(meridian) {
  const m = meridian.length;
  const segments = new Array(m - 1).fill(null);
  let start = 0;
  while (start < m - 1) {
    let end = start + 1;
    while (end < m - 1 && meridian[end][2] && Math.abs(meridian[end + 1][0] - meridian[end][0]) > 1e-9 && Math.abs(meridian[end][0] - meridian[end - 1][0]) > 1e-9) end++;
    const run = meridian.slice(start, end + 1);
    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };
      }
    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);
  const out = [meridian[0]];
  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);

  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];

    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;

    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];

    const b = vertexNormal(i + 1, faces[i]);

      groups.get(arc.tone).push(arc);

    if (x.groups.size !== y.groups.size) return false;

      out.to -= TAU;

          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));

  const sheet = (tone, levels) => {

      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));

  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;

        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {

      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));

      const mid = levelOf(i, (a.u + b.u) / 2);

        return;

      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);

  const vL = dot3(F.v, L);

  const m = meridian.length;

  for (let j = 0; j < n; j++) {

    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {

  const buckets = [[], [], [], [], []];

  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));

    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);

      all.push(d);
    }

  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);

  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;
      const cut1 = limb1 && trim > 0 ? Math.min(span * 0.25, trim / (speed(hi) || 1)) : 0;
      const t0 = lo + cut0;
      const t1 = hi - cut1;
      const n = count(t1 - t0);
      out.push(pathOf(Array.from({ length: n + 1 }, (_, j) => at(t0 + ((t1 - t0) * j) / n))));
    }
  }
  return out.join("");
}

function circleOf(F, s, r, P, steps = 0) {
  const count = steps || stepsFor(r, 24, 112);
  return pathOf(
    Array.from({ length: count }, (_, j) => iso(pointOf(F, s, r, (j / count) * TAU), P)),
    true,
  );
}

function spokesOf(F, s, r0, r1, count, P, { phase = 0, sweep = 0, from = 0, to = TAU } = {}) {
  const lines = [];
  for (let index = 0; index < count; index++) {
    const t = phase + from + (index / count) * (to - from);
    lines.push(pathOf([iso(pointOf(F, s, r0, t), P), iso(pointOf(F, s, r1, t + sweep), P)]));
  }
  return lines.join("");
}

const fadeOf = (value, [lo, hi]) => {
  const t = Math.max(0, Math.min(1, (value - lo) / (hi - lo || 1e-9)));
  return t * t * (3 - 2 * t);
};

function ribsOf(F, s0, s1, r, count, P, { phase = 0, twist = 0, least = 0.12, r1 = r, fade = null, seams = false } = {}) {
  const V = viewOf(P);
  const lines = [];
  const slope = (r1 - r) / (s1 - s0 || 1);
  for (let index = 0; index < count; index++) {
    const t = phase + (index / count) * TAU;
    const radial = radialOf(F, t + twist / 2);
    const normal = unit3([radial[0] - slope * F.a[0], radial[1] - slope * F.a[1], radial[2] - slope * F.a[2]]);
    const facing = dot3(normal, V);
    const d = pathOf([iso(pointOf(F, s0, r, t), P), iso(pointOf(F, s1, r1, t + twist), P)]);
    if (fade) {
      const alpha = fadeOf(facing, fade);
      if (alpha > 0.02) lines.push({ d, alpha });
      continue;
    }
    if (facing < least) continue;
    lines.push(d);
  }
  const ends = seams ? [seams === "last" ? "" : arcOf(F, s0, r, P, { slope }), seams === "first" ? "" : arcOf(F, s1, r1, P, { slope })].filter(Boolean) : [];
  if (fade) return [...lines, ...ends.map((d) => ({ d, alpha: 1 }))];
  return [...lines, ...ends].join("");
}

function rodOut(F, from, to, r, P, { stroke = 0, ...options } = {}) {
